    needs: build-linux-arm64
    if: ${{ needs.build-linux-arm64.result == 'success' }}
    runs-on: [self-hosted, apostate-build, apostate-windows-x64]
    timeout-minutes: 240
    env:
      TARGET: windows-x64
      ARCHIVE: apostate-152.0.7977.83-windows-x64.zip
    steps:
