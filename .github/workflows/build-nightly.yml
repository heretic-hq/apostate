      - name: Fetch pinned Chromium
        shell: bash
        run: bash scripts/fetch-sources.sh
      - name: Apply patch series without fuzz
        shell: bash
        run: bash scripts/apply-patches.sh --check && bash scripts/apply-patches.sh
      - name: Configure target
        shell: bash
        run: bash scripts/configure.sh "$TARGET"
      - name: Build official binary and manifest
        shell: bash
        run: bash scripts/build.sh "$TARGET"
      - name: Run resolver, baseline, and native smoke checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_profile_resolver.py
          python3 scripts/validate-release-baseline.py --root .
          smoke=".workspace/src/out/$TARGET/chrome"
          test -x "$smoke"
          "$smoke" --version
      - name: Package unsigned nightly artifact and manifest
        shell: bash
        run: |
          set -euo pipefail
          out=".workspace/src/out/$TARGET"
          stage="nightly-stage-$TARGET"
          rm -rf "$stage" "$ARCHIVE" "$ARCHIVE.manifest.json"
          mkdir -p "$stage/resources/profiles"
          cp "$out/chrome" "$stage/"
