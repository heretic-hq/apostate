name: nightly builds

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apostate-build-host
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build-macos-arm64:
    name: nightly-macos-arm64
    runs-on: [self-hosted, apostate-build, apostate-macos-arm64]
    timeout-minutes: 240
    env:
      TARGET: macos-arm64
      ARCHIVE: apostate-152.0.7977.83-macos-arm64.tar.zst
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify build inputs
        shell: bash
        run: |
          set -euo pipefail
          for path in scripts/verify-runner.sh scripts/bootstrap.sh scripts/fetch-sources.sh scripts/apply-patches.sh scripts/configure.sh scripts/build.sh scripts/validate-release-baseline.py scripts/test_profile_resolver.py build/CHROMIUM_VERSION build/DEPOT_TOOLS_REVISION build/args/$TARGET.gn patches/series LICENSE resources/profiles/catalogue.json; do
            test -f "$path" || { echo "missing build input: $path" >&2; exit 1; }
          done
          bash scripts/verify-runner.sh "$TARGET"
      - name: Bootstrap pinned toolchain
        shell: bash
        run: bash scripts/bootstrap.sh
      - name: Fetch pinned Chromium
        shell: bash
        run: bash scripts/fetch-sources.sh
      - name: Apply patch series without fuzz
        shell: bash
        run: bash scripts/apply-patches.sh --check && bash scripts/apply-patches.sh
      - name: Configure target
        shell: bash
        run: bash scripts/configure.sh "$TARGET"
      - name: Build official binary and manifest
        shell: bash
        run: bash scripts/build.sh "$TARGET"
      - name: Run resolver, baseline, and native smoke checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_profile_resolver.py
          python3 scripts/validate-release-baseline.py --root .
          smoke=".workspace/src/out/$TARGET/Chromium.app/Contents/MacOS/Chromium"
          test -x "$smoke"
          "$smoke" --version
      - name: Package unsigned nightly artifact and manifest
        shell: bash
        run: |
          set -euo pipefail
          out=".workspace/src/out/$TARGET"
          stage="nightly-stage-$TARGET"
          rm -rf "$stage" "$ARCHIVE" "$ARCHIVE.manifest.json"
          mkdir -p "$stage/resources/profiles"
          cp -R "$out/Chromium.app" "$stage/"
          cp LICENSE "$stage/"
          if [ -f NOTICE ]; then cp NOTICE "$stage/"; fi
          cp build/MANIFEST.lock "$stage/build-MANIFEST.lock"
          cp -R resources/profiles/. "$stage/resources/profiles/"
          tar --zstd -cf "$ARCHIVE" "$stage"
          python3 - "$ARCHIVE" "$ARCHIVE.manifest.json" "$TARGET" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          artifact, manifest, target = map(pathlib.Path, sys.argv[1:])
          catalogue = json.loads(pathlib.Path("resources/profiles/catalogue.json").read_text(encoding="utf-8"))
          data = {
              "package_version": "0.1.0",
              "chromium_version": pathlib.Path("build/CHROMIUM_VERSION").read_text(encoding="utf-8").strip(),
              "catalogue_version": catalogue["catalogue_version"],
              "platform": target,
              "artifact": artifact.name,
              "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
              "signature": None,
              "source_revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "patch_series_sha256": hashlib.sha256(pathlib.Path("patches/series").read_bytes()).hexdigest(),
              "build_manifest_sha256": hashlib.sha256(pathlib.Path("build/MANIFEST.lock").read_bytes()).hexdigest(),
          }
          manifest.write_bytes((json.dumps(data, ensure_ascii=True, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8"))
          PY
      - name: Upload nightly artifact and manifest
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: nightly-${{ env.TARGET }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.manifest.json

  build-linux-arm64:
