name: checks

on:
  pull_request:
    paths:
      - "config/**"
      - "ledger/**"
      - "release/**"
      - "resources/profiles/**"
      - "scripts/**"
      - "python/**"
      - "npm/**"
      - "patches/**"
      # check-schema-wiring.py resolves an x-wiring annotation's evidence
      # against a file in this repository, and one of them is
      # docs/LIMITATIONS.md. A docs-only edit can therefore invalidate a
      # schema annotation, so docs are a trigger rather than a blind spot.
      - "docs/**"
      - ".github/release/**"
      - ".github/workflows/check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    name: ledger validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate ledger
        if: ${{ hashFiles('scripts/validate-ledger.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/validate-ledger.py
          test -d ledger/schema
          test -f ledger/surfaces.jsonl
          test -f ledger/emitters.jsonl
          python3 scripts/validate-ledger.py

  baseline:
    name: release baseline validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate pinned baseline
        if: ${{ hashFiles('scripts/validate-release-baseline.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/validate-release-baseline.py
          test -f build/CHROMIUM_VERSION
          test -f build/MANIFEST.lock
          test -f patches/series
          python3 scripts/validate-release-baseline.py --root . --series-only
          python3 scripts/validate-release-baseline.py --root .

  patches:
    name: patch header validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate unified-diff hunk headers
        if: ${{ hashFiles('scripts/validate-patch-headers.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/validate-patch-headers.py
          test -f patches/series
          # Read-only, deliberately. A hunk header that overstates its body
          # makes git apply drop the surplus lines silently: the patch reports
          # that it applied cleanly and writes a truncated file. That is how
          # base/apostate/profile.cc lost its closing brace, the series died at
          # patch 7 against drifted context, and a build directory kept a
          # binary from a partial tree. Five corrupt hunks across three patches
          # were found this way. --fix is for a human repairing a patch; a CI
          # run that repaired its own inputs would prove nothing.
          python3 scripts/validate-patch-headers.py

  schema:
    name: schema validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Parse and validate schema documents
        if: ${{ hashFiles('scripts/validate-release-contract.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/validate-release-contract.py
          for schema in \
            config/launch.schema.json \
            config/profile.schema.json \
            python/apostate/assets/profile.schema.json \
            release/manifest.schema.json; do
            test -f "$schema"
          done
          python3 scripts/validate-release-contract.py --check-schemas
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("config/launch.schema.json"),
              Path("config/profile.schema.json"),
              Path("python/apostate/assets/profile.schema.json"),
              Path("release/manifest.schema.json"),
          ]
          paths.extend(sorted(Path("ledger/schema").glob("*.json")))
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"valid JSON: {path}")
          PY
          # The pip and npm packages ship copies of config/profile.schema.json
          # and resources/profiles/catalogue.json so an installed package works
          # with no checkout. Nothing kept those copies in step, and they were
          # hand-copied, which went stale twice in one afternoon: the catalogue
          # went from nine axes to twelve and both packaged copies stayed at
          # nine, so an installed package validated the new axes against the old
          # bundled catalogue and CI stayed green. This writes nothing, names
          # the stale paths, and costs under a second.
          python3 scripts/sync-packages.py --check

  wiring:
    name: schema wiring reconciliation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reconcile declared profile keys against the C++ that reads them
        if: ${{ hashFiles('scripts/check-schema-wiring.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/check-schema-wiring.py
          test -f config/profile.schema.json
          test -f patches/series
          # Its own job rather than a step inside "schema validation", because
          # a failure here is a different repair: the schema is well-formed and
          # a key in it is inert. fonts.enumeration_allowlist sat in the schema,
          # was composed into every profile, and was read by no C++ for its
          # whole life; fonts.provisioned_directory was never read at all; 0097
          # and 0099 were committed and left out of patches/series, so they were
          # in the repository and in no build. Every one of those was found by
          # hand, weeks after the artifacts started promising the feature. This
          # reads patches/ rather than a Chromium checkout, so it needs nothing
          # but this repository and runs in well under a second.
          python3 scripts/check-schema-wiring.py

  catalogue:
    name: catalogue and resolver validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate catalogue index
        if: ${{ hashFiles('scripts/profile_resolver.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/profile_resolver.py
          test -f resources/profiles/catalogue.json
          test -d resources/profiles/dispersion
          python3 scripts/profile_resolver.py --catalogue
      - name: Run deterministic resolver checks
        if: ${{ hashFiles('scripts/test_profile_resolver.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/test_profile_resolver.py
          test -f resources/profiles/catalogue.json
          test -d resources/profiles/dispersion
          python3 scripts/test_profile_resolver.py

  geoip:
    name: GeoIP validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run network-free GeoIP checks
        if: ${{ hashFiles('scripts/test_geoip.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/geoip.py
          test -f scripts/test_geoip.py
          python3 scripts/test_geoip.py

  python:
    name: Python package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run Python package tests
        if: ${{ hashFiles('python/tests/**/*.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -d python/apostate
          test -d python/tests
          python3 -m unittest discover python/tests

  node:
    name: Node package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run Node package tests
        if: ${{ hashFiles('npm/package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f npm/package.json
          test -d npm/test
          npm --prefix npm test
