name: probe runners

# Ask each runner image whether it carries what a build needs, without
# building anything.
#
# This runs on the SMALLEST instance of every family on purpose. Instance size
# changes compute and memory; it does not change the image contents or the
# storage figure, and every check here is a question about the image. A Windows
# 2 vCPU minute bills at an eighth of a 16 vCPU one and a sixteenth of a
# 32 vCPU one, so the answer costs a fraction of what learning it during a
# build costs.
#
# It is also the cheap way to confirm a fix: the Windows image lacks the
# Windows SDK's "Debugging Tools for Windows" feature, which
# build/vs_toolchain.py treats as mandatory, and this reports whether that is
# still true in about a minute.

on:
  workflow_dispatch:
    inputs:
      measure_windows_disk:
        description: "Measure whether a Windows build fits: checkout size on 2 vCPU, free space on the 32 vCPU build class"
        required: false
        type: boolean
        default: false
  # Weekly, because runner images are rebuilt continuously and a component
  # disappearing is exactly the failure this catches. Wednesday keeps it clear
  # of the nightly build window.
  schedule:
    - cron: "41 6 * * 3"

permissions:
  contents: read

concurrency:
  group: apostate-probe
  cancel-in-progress: true

jobs:
  probe:
    name: probe-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: blacksmith-2vcpu-ubuntu-2404
          - target: linux-arm64
            runner: blacksmith-2vcpu-ubuntu-2404
          - target: macos-arm64
            runner: blacksmith-6vcpu-macos-latest
          - target: windows-x64
            runner: blacksmith-2vcpu-windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Report available disk
        shell: bash
        run: df -h .
      # The Windows image reports 130GB of storage but only 55GB free, and a
      # measured complete build needs 66GB. Before deleting anything from a
      # runner image, measure what is actually on it -- including which python3
      # the build would lose if hostedtoolcache went.
      - name: Census Windows disk usage
        if: ${{ matrix.target == 'windows-x64' }}
        shell: bash
        run: |
          set -uo pipefail
          printf 'python3 resolves to: %s\n' "$(command -v python3 || echo none)"
          printf 'git resolves to: %s\n' "$(command -v git || echo none)"
          if command -v docker >/dev/null 2>&1; then
            echo "--- docker images"
            docker images --format '{{.Size}}\t{{.Repository}}:{{.Tag}}' 2>&1 | head -20
          else
            echo "--- no docker"
          fi
          echo "--- candidate directory sizes (MB)"
          for dir in \
            "/c/Android" \
            "/c/hostedtoolcache" \
            "/c/Program Files/dotnet" \
            "/c/Program Files/MongoDB" \
            "/c/Program Files/MySQL" \
            "/c/Program Files/PostgreSQL" \
            "/c/Program Files/Microsoft SDKs" \
            "/c/Program Files/Microsoft Visual Studio" \
            "/c/Program Files (x86)/Microsoft SDKs" \
            "/c/Program Files (x86)/Windows Kits" \
            "/c/ProgramData/chocolatey" \
            "/c/ProgramData/Docker" \
            "/c/Windows/SoftwareDistribution" \
            "/c/Windows/Installer"; do
            if [ -d "$dir" ]; then
              printf '%8s MB  %s\n' "$(du -sm "$dir" 2>/dev/null | cut -f1)" "$dir"
            else
              printf '%8s     %s\n' "absent" "$dir"
            fi
          done
          echo "--- hostedtoolcache breakdown"
          du -sm /c/hostedtoolcache/* 2>/dev/null | sort -rn | head -10
      # Runs the same provisioning the build does, so this probe rehearses the
      # real Windows setup path rather than only reporting what the bare image
      # has. A pass here means the build's first minutes will pass too.
      - name: Provision Windows debugging tools
        if: ${{ matrix.target == 'windows-x64' }}
        shell: bash
        run: bash scripts/provision-windows-debuggers.sh
      - name: Verify host tooling
        env:
          PROBE_TARGET: ${{ matrix.target }}
        shell: bash
        run: bash scripts/verify-host-tooling.sh "$PROBE_TARGET"
      - name: Verify runner pairing
        env:
          PROBE_TARGET: ${{ matrix.target }}
        shell: bash
        run: bash scripts/verify-runner.sh "$PROBE_TARGET"

  # Answers one number: how much disk a Windows Chromium checkout actually
  # occupies. A local macOS build measured 66GB total, but that included
  # third_party/swift-toolchain, which Windows never fetches, so the Windows
  # figure has to be measured rather than inferred. Runs on 2 vCPU because
  # gclient sync is network-bound -- the work is identical to the 32 vCPU
  # runner at a sixteenth of the rate, and learning this from a failed 32 vCPU
  # build would cost hours of the most expensive runner we use.
  measure-windows-checkout:
    name: measure-windows-checkout
    if: ${{ inputs.measure_windows_disk }}
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 120
    env:
      # Named rather than left to target_default(), so this job says what it is
      # measuring instead of inheriting it from whatever host it lands on.
      APOSTATE_TARGET: windows-x64
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Initialize workspace
        shell: bash
        run: |
          set -euo pipefail
          root="$(cygpath -m "$RUNNER_TEMP")"
          workspace="$root/apostate-workspace"
          mkdir -p "$workspace"
          printf 'APOSTATE_WORKSPACE=%s\n' "$workspace" >> "$GITHUB_ENV"
      - name: Reclaim Windows disk
        shell: bash
        run: bash scripts/reclaim-windows-disk.sh
      - name: Bootstrap pinned toolchain
        shell: bash
        run: bash scripts/bootstrap.sh
      - name: Fetch pinned Chromium
        shell: bash
        run: bash scripts/fetch-sources.sh
      - name: Measure the checkout
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          df -h /c
          printf 'checkout total: %s MB\n' \
            "$(du -sm "$APOSTATE_WORKSPACE/src" 2>/dev/null | cut -f1)"
          echo "--- largest subtrees (MB)"
          du -sm "$APOSTATE_WORKSPACE/src"/* "$APOSTATE_WORKSPACE/src/third_party"/* 2>/dev/null |
            sort -rn | head -15

  # Free space is not instance-size-invariant: a 2 vCPU Windows runner measured
  # 70.8GB free and a 32 vCPU one 55GB. The cheap runner looks roomier, so a
  # verdict taken from it errs in the dangerous direction. This job reports free
  # space on the class that actually builds, before and after reclaiming, and
  # nothing else -- two or three minutes, no sync, no build.
  census-windows-build-class:
    name: census-windows-build-class
    # Gated: this is the most expensive runner class we use, and the weekly
    # probe exists to be cheap. Paired with the checkout measurement because
    # neither number decides anything on its own.
    if: ${{ inputs.measure_windows_disk }}
    runs-on: blacksmith-32vcpu-windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Report free space before reclaiming
        shell: bash
        run: df -h /c
      - name: Reclaim Windows disk
        shell: bash
        run: bash scripts/reclaim-windows-disk.sh
      - name: Report free space after reclaiming
        shell: bash
        run: df -h /c
