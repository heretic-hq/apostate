    needs: release-gate
    if: ${{ needs.release-gate.result == 'success' }}
    runs-on: blacksmith-32vcpu-windows-2025
    timeout-minutes: 240
    env:
      TARGET: windows-x64
      ARCHIVE: apostate-152.0.7977.83-windows-x64.zip
