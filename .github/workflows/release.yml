          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sig
            ${{ env.ARCHIVE }}.manifest.json

  publish:
    name: verify all artifacts and publish release
    needs:
      - release-gate
      - build-macos-arm64
      - build-linux-arm64
      - build-linux-x64
      - build-windows-x64
    if: ${{ needs.release-gate.result == 'success' && needs.build-macos-arm64.result == 'success' && needs.build-linux-arm64.result == 'success' && needs.build-linux-x64.result == 'success' && needs.build-windows-x64.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out tagged release policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.release-gate.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify release policy inputs
        shell: bash
        run: |
          set -euo pipefail
          for path in .github/release/public-key.txt .github/release/artifact-policy.json scripts/validate-release-contract.py release/manifest.schema.json; do
            test -f "$path" || { echo "missing release verification input: $path" >&2; exit 1; }
          done
          python3 - <<'PY'
          import json
          for path in (".github/release/artifact-policy.json", "release/manifest.schema.json"):
              json.load(open(path, encoding="utf-8"))
          PY
      - name: Download all four signed artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: release-*-${{ needs.release-gate.outputs.tag }}
          path: release-inputs
          merge-multiple: true
      - name: Verify manifests, hashes, and Ed25519 signatures
        env:
          EXPECTED_SOURCE_REVISION: ${{ needs.release-gate.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(release-inputs/*.manifest.json)
          [ "${#manifests[@]}" -eq 4 ] || { echo "expected four release manifests, got ${#manifests[@]}" >&2; exit 1; }
          expected='apostate-152.0.7977.83-'
          declare -A seen=()
          for manifest in "${manifests[@]}"; do
            artifact="${manifest%.manifest.json}"
            signature="$artifact.sig"
            canonical="$RUNNER_TEMP/$(basename "$manifest").unsigned.json"
            [ -f "$artifact" ] || { echo "artifact missing for $manifest" >&2; exit 1; }
            [ -f "$signature" ] || { echo "signature missing for $artifact" >&2; exit 1; }
            python3 - "$manifest" "$artifact" "$signature" "$canonical" "$EXPECTED_SOURCE_REVISION" <<'PY'
          import base64, hashlib, json, pathlib, re, sys
          manifest, artifact, signature_path, canonical = map(pathlib.Path, sys.argv[1:5])
          expected_revision = sys.argv[5]
          required = {
              "package_version", "chromium_version", "catalogue_version", "platform",
              "artifact", "sha256", "signature", "source_revision",
              "patch_series_sha256", "build_manifest_sha256",
          }
          data = json.loads(manifest.read_text(encoding="utf-8"))
          if set(data) != required:
              raise SystemExit(f"manifest fields do not match release contract: {manifest}")
          if data["package_version"] != "0.1.0" or data["chromium_version"] != "152.0.7977.83" or data["catalogue_version"] != 1:
              raise SystemExit(f"manifest version mismatch: {manifest}")
          if data["artifact"] != artifact.name:
              raise SystemExit(f"artifact binding mismatch: {manifest}")
          if data["source_revision"] != expected_revision or not re.fullmatch(r"[0-9a-f]{40}", data["source_revision"]):
              raise SystemExit(f"source revision mismatch: {manifest}")
          if data["sha256"] != hashlib.sha256(artifact.read_bytes()).hexdigest():
              raise SystemExit(f"artifact SHA-256 mismatch: {artifact}")
          if not re.fullmatch(r"[A-Za-z0-9+/]{86}==", data["signature"]):
              raise SystemExit(f"manifest signature is not padded base64: {manifest}")
          raw = base64.b64decode(data["signature"], validate=True)
          if len(raw) != 64 or signature_path.read_bytes() != raw:
              raise SystemExit(f"signature sidecar mismatch: {manifest}")
          unsigned = dict(data)
          unsigned["signature"] = None
          canonical.write_bytes((json.dumps(unsigned, ensure_ascii=True, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8"))
          PY
            python3 scripts/validate-release-contract.py --kind manifest "$manifest"
            openssl pkeyutl -verify -rawin -pubin -inkey .github/release/public-key.txt -sigfile "$signature" -in "$canonical"
            case "$(basename "$artifact")" in
              "$expected"linux-x64.tar.zst) platform=linux-x64 ;;
              "$expected"linux-arm64.tar.zst) platform=linux-arm64 ;;
              "$expected"macos-arm64.tar.zst) platform=macos-arm64 ;;
              "$expected"windows-x64.zip) platform=windows-x64 ;;
              *) echo "unexpected artifact name: $artifact" >&2; exit 1 ;;
            esac
            [ -z "${seen[$platform]:-}" ] || { echo "duplicate platform: $platform" >&2; exit 1; }
            seen[$platform]=1
            python3 - "$manifest" "$platform" <<'PY'
          import json, pathlib, sys
          manifest, platform = pathlib.Path(sys.argv[1]), sys.argv[2]
          if json.loads(manifest.read_text(encoding="utf-8"))["platform"] != platform:
              raise SystemExit(f"manifest platform mismatch: {manifest}")
          PY
          done
          for platform in linux-x64 linux-arm64 macos-arm64 windows-x64; do
            [ -n "${seen[$platform]:-}" ] || { echo "missing platform: $platform" >&2; exit 1; }
          done
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-gate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-inputs/* --verify-tag --title "Apostate $RELEASE_TAG" --notes "Signed Apostate artifacts for Chromium 152.0.7977.83."
