          cp -R resources/profiles/. "$stage/resources/profiles/"
          tar --zstd -cf "$ARCHIVE" "$stage"
          python3 - "$ARCHIVE" "$ARCHIVE.manifest.json" "$ARCHIVE.sig" "$TARGET" "$key" <<'PY'
          import base64, hashlib, json, pathlib, subprocess, sys
