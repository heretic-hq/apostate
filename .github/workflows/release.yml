name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing signed version tag to rebuild and publish"
        required: true
        type: string
      signed:
        description: "Confirm that this manual release is explicitly authorized"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  release-gate:
    name: signed tag and pre-release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      revision: ${{ steps.tag.outputs.revision }}
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require signed version tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          SIGNED_CONFIRMATION: ${{ inputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            [ "$SIGNED_CONFIRMATION" = true ] || { echo "workflow_dispatch requires signed=true" >&2; exit 1; }
            tag="$REQUESTED_TAG"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release must use a version tag such as v1.2.3" >&2
            exit 1
          }
          git fetch --force --tags origin
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          git tag -v "$tag"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git checkout --detach "refs/tags/$tag"
          fi
          revision="$(git rev-parse HEAD)"
          [ "$revision" = "$(git rev-parse "refs/tags/$tag^{commit}")" ] || {
            echo "checked out revision is not the signed tag target" >&2
            exit 1
          }
          printf 'tag=%s\nrevision=%s\n' "$tag" "$revision" >> "$GITHUB_OUTPUT"
      - name: Validate release baseline
        shell: bash
        run: |
          set -euo pipefail
          for path in scripts/validate-release-baseline.py build/CHROMIUM_VERSION build/MANIFEST.lock patches/series; do
            test -f "$path" || { echo "missing release gate input: $path" >&2; exit 1; }
          done
          python3 scripts/validate-release-baseline.py --root .
      - name: Run resolver checks
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/test_profile_resolver.py
          test -f resources/profiles/catalogue.json
          python3 scripts/test_profile_resolver.py
      - name: Run Python package tests
        shell: bash
        run: |
          set -euo pipefail
          test -d python/tests
          python3 -m unittest discover python/tests
      - name: Run Node package tests
        shell: bash
        run: |
          set -euo pipefail
          test -f npm/package.json
          test -d npm/test
          npm --prefix npm test

  build-macos-arm64:
    name: build-macos-arm64
    needs: release-gate
    if: ${{ needs.release-gate.result == 'success' }}
    runs-on: blacksmith-12vcpu-macos-latest
    timeout-minutes: 240
    env:
      TARGET: macos-arm64
      ARCHIVE: apostate-152.0.7977.83-macos-arm64.tar.zst
      RELEASE_SIGNING_KEY: ${{ secrets.APOSTATE_RELEASE_PRIVATE_KEY }}
    steps:
      - name: Check out exact signed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.release-gate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify build inputs
        shell: bash
        run: |
          set -euo pipefail
          for path in scripts/bootstrap.sh scripts/fetch-sources.sh scripts/apply-patches.sh scripts/configure.sh scripts/build.sh scripts/validate-release-baseline.py scripts/test_profile_resolver.py build/CHROMIUM_VERSION build/DEPOT_TOOLS_REVISION build/args/$TARGET.gn patches/series LICENSE resources/profiles/catalogue.json; do
            test -f "$path" || { echo "missing build input: $path" >&2; exit 1; }
          done
      - name: Bootstrap pinned toolchain
        shell: bash
        run: bash scripts/bootstrap.sh
      - name: Fetch pinned Chromium
        shell: bash
        run: bash scripts/fetch-sources.sh
      - name: Apply patch series without fuzz
        shell: bash
        run: bash scripts/apply-patches.sh --check && bash scripts/apply-patches.sh
      - name: Configure target
        shell: bash
        run: bash scripts/configure.sh "$TARGET"
      - name: Build official binary and manifest
        shell: bash
        run: bash scripts/build.sh "$TARGET"
      - name: Run native smoke and manifest checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_profile_resolver.py
          python3 scripts/validate-release-baseline.py --root .
          smoke=".workspace/src/out/$TARGET/Chromium.app/Contents/MacOS/Chromium"
          test -x "$smoke"
          "$smoke" --version
      - name: Package and sign verified artifact
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "APOSTATE_RELEASE_PRIVATE_KEY is required" >&2; exit 1; }
          out=".workspace/src/out/$TARGET"
          stage="release-stage-$TARGET"
          key="$RUNNER_TEMP/apostate-release-signing-key.pem"
          rm -rf "$stage" "$ARCHIVE" "$ARCHIVE.sig" "$ARCHIVE.manifest.json" "$key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          chmod 600 "$key"
          mkdir -p "$stage/resources/profiles"
          cp -R "$out/Chromium.app" "$stage/"
          cp LICENSE "$stage/"
          if [ -f NOTICE ]; then cp NOTICE "$stage/"; fi
          cp build/MANIFEST.lock "$stage/build-MANIFEST.lock"
          cp -R resources/profiles/. "$stage/resources/profiles/"
          tar --zstd -cf "$ARCHIVE" "$stage"
          python3 - "$ARCHIVE" "$ARCHIVE.manifest.json" "$ARCHIVE.sig" "$TARGET" "$key" <<'PY'
          import base64, hashlib, json, pathlib, subprocess, sys
          artifact, manifest, signature_path, target, key = map(pathlib.Path, sys.argv[1:])
          catalogue = json.loads(pathlib.Path("resources/profiles/catalogue.json").read_text(encoding="utf-8"))
          data = {
              "package_version": "0.1.0",
              "chromium_version": pathlib.Path("build/CHROMIUM_VERSION").read_text(encoding="utf-8").strip(),
              "catalogue_version": catalogue["catalogue_version"],
              "platform": target,
              "artifact": artifact.name,
              "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
              "signature": None,
              "source_revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "patch_series_sha256": hashlib.sha256(pathlib.Path("patches/series").read_bytes()).hexdigest(),
              "build_manifest_sha256": hashlib.sha256(pathlib.Path("build/MANIFEST.lock").read_bytes()).hexdigest(),
          }
          canonical = (json.dumps(data, ensure_ascii=True, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          unsigned = manifest.with_name(manifest.name + ".unsigned")
          unsigned.write_bytes(canonical)
          subprocess.run(["openssl", "pkeyutl", "-sign", "-rawin", "-inkey", str(key), "-in", str(unsigned), "-out", str(signature_path)], check=True)
          raw = signature_path.read_bytes()
          if len(raw) != 64:
              raise SystemExit(f"Ed25519 signature must be 64 bytes, got {len(raw)}")
          data["signature"] = base64.b64encode(raw).decode("ascii")
          manifest.write_bytes((json.dumps(data, ensure_ascii=True, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8"))
          unsigned.unlink()
          PY
      - name: Upload signed release candidate
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: release-${{ env.TARGET }}-${{ needs.release-gate.outputs.tag }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sig
            ${{ env.ARCHIVE }}.manifest.json

