<!doctype html>
<meta charset="utf-8">
<title>apostate coherence probe</title>
<body>
<script>
// The operands of every coherence edge that is decidable inside ONE running
// browser, measured and POSTed back to the server that served this page.
// capture/derive/coherence.py serves it, launches the browser at it, and
// decides the edges; this file decides nothing.
//
// Why this is not a collector probe. The capture collector is an instrument
// for recording what a device emits, so that two devices can be compared. The
// edges here are not comparisons: they are relations that must hold in one
// binary, with no reference capture involved. Three of their operands —
// screenX, outerWidth, availWidth and their neighbours — are deliberately
// excluded from conform.py's field diff because window position and size are
// the user's choice rather than the device's identity, so a V3 diff cannot
// decide a relation over them however faithfully they are recorded. And a
// collector change costs a collector identity change, which strands every
// reference capture taken by the previous one (capture/README.md, "Collector
// generations"). One instrument per question.
//
// Three rules carried over from the collector, because they are what make a
// measurement usable as evidence:
//
//   1. Measure or admit failure. Each edge returns {ok, value, error}. No
//      fallback constants, no catch that substitutes a plausible number.
//   2. Raw before derived. The operands travel, not a verdict. This page does
//      not compute "holds": the gate does, from the numbers below, so that a
//      failure names the values that produced it and a reader can recompute
//      the decision by hand.
//   3. Read twice. Every edge is measured twice in one session and both reads
//      are kept. A relation that holds on one read and not the other is a
//      moving window or a per-call perturbation, and both are findings.
(async () => {
  const measure = {};

  // ---------------------------------------------------------------------
  // coh.window-within-avail-rect
  //
  // The window rect and the available rect reach the renderer over two
  // different mojo channels from two different browser-side sources
  // (render_widget_host_impl.cc:665-673 and display_util.cc:20), so nothing
  // below this point enforces the relation once the screen values are spoofed.
  // isExtended travels because the row's "negative screen coordinates are
  // impossible" clause is true of a single display and false of two, where a
  // panel left of or above the primary gives its neighbours negative origins.
  // ---------------------------------------------------------------------
  measure["coh.window-within-avail-rect"] = () => ({
    screenX: window.screenX,
    screenY: window.screenY,
    outerWidth: window.outerWidth,
    outerHeight: window.outerHeight,
    innerWidth: window.innerWidth,
    innerHeight: window.innerHeight,
    availLeft: screen.availLeft,
    availTop: screen.availTop,
    availWidth: screen.availWidth,
    availHeight: screen.availHeight,
    screenWidth: screen.width,
    screenHeight: screen.height,
    isExtended: typeof screen.isExtended === "boolean" ? screen.isExtended : null,
    devicePixelRatio: window.devicePixelRatio
  });

  // ---------------------------------------------------------------------
  // coh.layout-integer-positions
  //
  // position:fixed, for three reasons that each turn an arithmetic comparison
  // into an exact one. The containing block is the viewport, so
  // getBoundingClientRect returns the used left and top directly rather than
  // an offset from some ancestor's own rect. A fixed box does not move with
  // the page's scroll offset. And it does not extend the scrollable area, so
  // the sample at left:1234px cannot raise a scrollbar and perturb the layout
  // being measured.
  //
  // Every coordinate below is representable in LayoutUnit's 1/64 px, so exact
  // equality is the right predicate: a mismatch is an introduced offset and
  // never a rounding artifact. The -10000/0 pair is the row's own evidence,
  // where real Chrome returns x=-10000, y=0 and the perturbing browser
  // returned x=-10000.015625, y=-0.03125 — offsets of 1/64 and 1/32 px.
  // ---------------------------------------------------------------------
  const SAMPLES = [
    { id: "offscreen", left: -10000, top: 0 },
    { id: "origin", left: 0, top: 0 },
    { id: "positive", left: 37, top: 11 },
    { id: "large", left: 1234, top: 567 }
  ];
  measure["coh.layout-integer-positions"] = () => {
    const nodes = SAMPLES.map((sample) => {
      const el = document.createElement("div");
      el.style.cssText = "position:fixed;visibility:hidden;margin:0;padding:0;border:0;"
        + `width:10px;height:10px;left:${sample.left}px;top:${sample.top}px`;
      document.body.appendChild(el);
      return el;
    });
    const samples = SAMPLES.map((sample, i) => {
      const cs = getComputedStyle(nodes[i]);
      const rect = nodes[i].getBoundingClientRect();
      return {
        id: sample.id,
        // The declaration, the used value and the box, kept apart because
        // they fail for different reasons: computed style disagreeing with the
        // declaration is a perturbed used value, the rect disagreeing with
        // computed style is a perturbed box.
        declared: { left: sample.left, top: sample.top },
        computed: { left: cs.left, top: cs.top },
        rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height }
      };
    });
    nodes.forEach((el) => el.remove());
    return { samples };
  };

  // ---------------------------------------------------------------------
  // coh.resolved-timezone-in-supported-set
  //
  // ICU's enumeration excludes Etc/Unknown, every alias whose canonical id
  // differs from itself, and every zone whose region is "001", so 29 of the
  // 447 canonical entries never appear in it (icu timezone.cpp:643-666).
  // resolvedOptions runs getCanonicalID over the adopted zone, so the failure
  // mode is not an alias appearing here: it is a profile naming US/Pacific
  // while the browser correctly reports America/Los_Angeles, after which every
  // field diff blames the timezone.
  //
  // The whole enumeration travels rather than a membership answer. It is
  // ~8 KB, it is the one operand of this edge that no capture records, and
  // shipping it means the gate recomputes the decision from ICU's own list
  // instead of trusting a boolean computed here. worker.date-timezone is a
  // member of the edge, so the Worker realm — which resolves its own ICU
  // default — is asked the same question.
  //
  // Each realm also resolves its own zone A SECOND TIME, through itself.
  // resolvedOptions runs getCanonicalID over whatever zone was adopted, so an
  // alias can never appear here directly: a canonical id is a fixed point of
  // that mapping and an alias is not. That second resolution is the operand
  // that catches a change writing a profile's string into the reported value
  // without canonicalising it, which is the divergence the row describes.
  // ---------------------------------------------------------------------
  const workerTimezone = () => {
    const src = `self.onmessage = () => {
      const out = { timezone: null, canonical: null, supported_count: null,
                    in_supported_set: null, error: null };
      try {
        out.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        out.canonical = new Intl.DateTimeFormat("en", { timeZone: out.timezone })
          .resolvedOptions().timeZone;
        if (typeof Intl.supportedValuesOf === "function") {
          const zones = Intl.supportedValuesOf("timeZone");
          out.supported_count = zones.length;
          out.in_supported_set = zones.includes(out.timezone);
        }
      } catch (e) { out.error = String((e && e.message) || e); }
      self.postMessage(out);
    };`;
    const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
    return new Promise((resolve, reject) => {
      const w = new Worker(url);
      const timer = setTimeout(() => reject(new Error("worker timed out")), 8000);
      w.onmessage = (e) => { clearTimeout(timer); w.terminate(); URL.revokeObjectURL(url); resolve(e.data); };
      w.onerror = (e) => { clearTimeout(timer); URL.revokeObjectURL(url); reject(new Error(e.message || "worker error")); };
      w.postMessage(null);
    });
  };
  measure["coh.resolved-timezone-in-supported-set"] = async () => {
    if (typeof Intl.supportedValuesOf !== "function") {
      throw new Error("Intl.supportedValuesOf unsupported");
    }
    const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    return {
      timezone: zone,
      canonical: new Intl.DateTimeFormat("en", { timeZone: zone }).resolvedOptions().timeZone,
      supported: Intl.supportedValuesOf("timeZone"),
      worker: await workerTimezone()
    };
  };

  // ---------------------------------------------------------------------
  // coh.audio-render-independent-of-audio-hardware
  //
  // The row's own one-line detector: ask an OfflineAudioContext for a rate the
  // claimed hardware does not run at, and check that the render happened, that
  // it reports the rate it was asked for, and that it hashes the same as it
  // does anywhere else. The offline sample rate is the constructor argument
  // (offline_audio_context.cc:98) and MaxChannelCount returns the
  // constructor's channel count rather than the hardware's
  // (offline_audio_destination_handler.cc:94-96), so nothing on this path
  // reads a device and a fork where it does has introduced a coupling stock
  // Chrome does not have.
  //
  // The rates are fixed rather than derived from the hardware, because a hash
  // is comparable between two runs only if both asked for the same thing. The
  // live context's claim travels beside them so the gate can state what it
  // varied: two runs agreeing on these hashes prove nothing unless their
  // claimed audio hardware differs, and the gate refuses to call that a pass.
  //
  // The graph is audio.offline_render's, so the two instruments measure the
  // same thing: triangle oscillator at 10 kHz through a DynamicsCompressor
  // with the conventional settings.
  // ---------------------------------------------------------------------
  const sha256Hex = async (bytes) => Array.from(
    new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)),
    (b) => b.toString(16).padStart(2, "0")
  ).join("");

  const offlineTone = async (channels, length, rate) => {
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OAC) throw new Error("OfflineAudioContext unsupported");
    const ctx = new OAC(channels, length, rate);
    const osc = ctx.createOscillator();
    const comp = ctx.createDynamicsCompressor();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(10000, ctx.currentTime);
    comp.threshold.setValueAtTime(-50, ctx.currentTime);
    comp.knee.setValueAtTime(40, ctx.currentTime);
    comp.ratio.setValueAtTime(12, ctx.currentTime);
    comp.attack.setValueAtTime(0, ctx.currentTime);
    comp.release.setValueAtTime(0.25, ctx.currentTime);
    osc.connect(comp);
    comp.connect(ctx.destination);
    osc.start(0);
    return ctx.startRendering();
  };

  const RENDERS = [
    { channels: 1, rate: 44100 },
    { channels: 1, rate: 48000 },
    { channels: 2, rate: 44100 }
  ];
  measure["coh.audio-render-independent-of-audio-hardware"] = async () => {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error("AudioContext unsupported");
    const live = new AC();
    const hardware = {
      sampleRate: live.sampleRate,
      maxChannelCount: live.destination.maxChannelCount,
      channelCount: live.destination.channelCount
    };
    live.close();

    const renders = [];
    for (const spec of RENDERS) {
      const buf = await offlineTone(spec.channels, spec.rate, spec.rate);
      const parts = [];
      let sliceSum = 0;
      for (let c = 0; c < buf.numberOfChannels; c++) {
        const ch = buf.getChannelData(c);
        parts.push(new Uint8Array(ch.buffer, ch.byteOffset, ch.byteLength));
        for (let i = 4000; i < 6000 && i < ch.length; i++) sliceSum += Math.abs(ch[i]);
      }
      const joined = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
      let at = 0;
      for (const p of parts) { joined.set(p, at); at += p.length; }
      renders.push({
        requested: { channels: spec.channels, rate: spec.rate, length: spec.rate },
        reported: {
          sampleRate: buf.sampleRate,
          length: buf.length,
          numberOfChannels: buf.numberOfChannels
        },
        sha256: await sha256Hex(joined),
        // Kept in the clear for the reason audio.offline_render keeps its own:
        // a silently zeroed buffer hashes identically on every machine, so a
        // cross-run comparison over digests alone can agree by measuring
        // nothing.
        slice_sum: sliceSum
      });
    }
    return { hardware, renders };
  };

  // ------------------------------------------------------------------ run
  const edges = {};
  for (const [id, fn] of Object.entries(measure)) {
    const entry = { ok: false, value: null, repeat: null, error: null };
    try {
      entry.value = await fn();
      // Rule 3. The second read is a fresh measurement: new elements, a new
      // Worker, a new OfflineAudioContext and a fresh read of the live window.
      entry.repeat = await fn();
      entry.ok = true;
    } catch (e) {
      entry.error = String((e && (e.message || e.name)) || e);
    }
    edges[id] = entry;
  }

  const automation = [];
  if (navigator.webdriver) automation.push("navigator.webdriver");
  if (/Headless/i.test(navigator.userAgent)) automation.push("UA contains Headless");

  const result = {
    probe_version: 1,
    context: {
      taken_at: new Date().toISOString(),
      label: new URLSearchParams(location.search).get("label") || null,
      ua: navigator.userAgent,
      device_pixel_ratio: window.devicePixelRatio,
      // A relation over window geometry is only meaningful where a window
      // exists. Headless reports outerWidth 0 and no work area, so the gate
      // refuses a headless result rather than reading it as a pass.
      headed: typeof window.outerWidth === "number" && window.outerWidth > 0,
      secure_context: !!window.isSecureContext,
      automation_signals: automation
    },
    edges
  };

  document.body.textContent = JSON.stringify(
    Object.fromEntries(Object.entries(edges).map(([k, v]) => [k, v.ok ? "measured" : v.error])),
    null, 1);
  try {
    await fetch("/submit", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(result)
    });
  } catch (e) {
    // The runner's deadline reports this; keep it reachable for a human run.
    window.__coherenceResult = result;
    document.body.textContent = "submit failed: " + ((e && e.message) || e);
  }
  document.documentElement.dataset.coherenceDone = "1";
})();
</script>
