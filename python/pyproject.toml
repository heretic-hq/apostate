[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apostate"
version = "0.1.0"
description = "Patchright-compatible Python interface for the Apostate native Chromium build"
requires-python = ">=3.10"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{name = "Apostate contributors"}]
dependencies = []

[project.optional-dependencies]
# The browser ships itself; these are only the drivers that can steer it, and
# neither needs `playwright install`.
patchright = ["patchright>=1.40"]
playwright = ["playwright>=1.40"]

[project.scripts]
apostate = "apostate.cli:main"

[project.urls]
Homepage = "https://github.com/heretic-hq/apostate"
Source = "https://github.com/heretic-hq/apostate"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["apostate*"]

[tool.setuptools.package-data]
apostate = ["assets/*.json"]
