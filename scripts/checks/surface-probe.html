<!doctype html>
<meta charset="utf-8">
<title>apostate surface probe</title>
<body>
<script>
// One page, every surface this project claims to serve, plus the controls
// that decide whether a claim is real. POSTs a flat JSON object back to the
// server that served it.
//
// Two rules learned the expensive way and encoded here:
//
//   1. A reported limit is not a usable limit. Every allocation is followed
//      by a framebuffer attachment, a completeness check, a clear and a
//      readback, because SwiftShader accepts a texStorage2D at any size and
//      then fails to render to it. A probe that stops at getError() reports a
//      pass that a detector would not give.
//
//   2. An extension name in getSupportedExtensions() is not an extension.
//      getExtension() is called for each interesting name and the result
//      recorded, because a name that lists but returns null is a stronger
//      signal than a name that is simply absent.
//
// Every block is individually guarded. An exception in one surface must not
// leave the whole report empty, which is how an earlier version of this probe
// reported nothing and was mistaken for a browser that would not start.
(async () => {
  const o = {};
  const put = async (key, fn) => {
    try { o[key] = await fn(); } catch (e) { o[key] = `ERR:${e.name}`; }
  };
  const n = navigator;

  await put("nav", () => ({
    ua: n.userAgent, platform: n.platform, cores: n.hardwareConcurrency,
    mem: n.deviceMemory, langs: n.languages.join(","), webdriver: n.webdriver,
    vendor: n.vendor, maxTouch: n.maxTouchPoints, pdf: n.pdfViewerEnabled,
    plugins: n.plugins.length, mimeTypes: n.mimeTypes.length,
  }));
  await put("screen", () => ({
    dims: [screen.width, screen.height, screen.availWidth, screen.availHeight],
    depth: screen.colorDepth, dpr: devicePixelRatio,
    outer: [outerWidth, outerHeight], inner: [innerWidth, innerHeight],
    // outer < inner is impossible on any real browser and is the shape an
    // automation driver imposes by default; it is worth its own field.
    outerExceedsInner: outerWidth >= innerWidth && outerHeight >= innerHeight,
    availWithinScreen: screen.availWidth <= screen.width && screen.availHeight <= screen.height,
  }));
  await put("intl", () => {
    const r = Intl.DateTimeFormat().resolvedOptions();
    return { tz: r.timeZone, locale: r.locale };
  });
  await put("uaData", () => n.userAgentData ? {
    brands: n.userAgentData.brands.map((b) => `${b.brand}/${b.version}`).sort().join(" "),
    mobile: n.userAgentData.mobile, platform: n.userAgentData.platform,
  } : null);
  await put("hev", () => n.userAgentData.getHighEntropyValues(
    ["architecture", "bitness", "model", "platformVersion", "uaFullVersion", "wow64"]));
  await put("automation", () => ({
    chrome: typeof window.chrome,
    runtime: !!(window.chrome && window.chrome.runtime),
    // The classic sentinels. Present-and-empty is still a finding.
    sentinels: Object.keys(window).filter((k) =>
      /cdc_|\$cdc|selenium|driver|puppeteer|playwright|webdriver/i.test(k)).sort(),
  }));
  await put("perms", async () =>
    (await n.permissions.query({ name: "notifications" })).state);
  await put("battery", async () => {
    const b = await n.getBattery();
    return { charging: b.charging, level: b.level, ct: b.chargingTime, dt: b.dischargingTime };
  });
  await put("conn", () => n.connection ? {
    type: n.connection.effectiveType, rtt: n.connection.rtt,
    down: n.connection.downlink, save: n.connection.saveData,
  } : null);
  await put("devices", async () =>
    (await n.mediaDevices.enumerateDevices()).map((d) => d.kind).sort().join(","));
  await put("fonts", () => document.fonts.size);
  await put("audio", () => {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const out = {
      rate: ac.sampleRate, base: ac.baseLatency,
      maxCh: ac.destination.maxChannelCount,
      // baseLatency is frames/rate, so recovering the frame count is what
      // shows whether both halves of the ratio came from the same place.
      impliedFrames: Math.round(ac.baseLatency * ac.sampleRate),
    };
    ac.close();
    return out;
  });
  await put("drm", async () => {
    const out = {};
    for (const ks of ["com.widevine.alpha", "org.w3.clearkey"]) {
      try {
        await n.requestMediaKeySystemAccess(ks, [{
          initDataTypes: ["cenc"],
          videoCapabilities: [{ contentType: 'video/mp4;codecs="avc1.42E01E"' }],
        }]);
        out[ks] = "ok";
      } catch { out[ks] = "no"; }
    }
    return out;
  });
  await put("codecs", () => {
    const v = document.createElement("video");
    return {
      h264: v.canPlayType('video/mp4;codecs="avc1.42E01E"'),
      hevc: v.canPlayType('video/mp4;codecs="hev1.1.6.L93.B0"'),
      av1: v.canPlayType('video/mp4;codecs="av01.0.05M.08"'),
    };
  });
  await put("webgpu", async () => {
    const a = await n.gpu.requestAdapter();
    if (!a) return "no adapter";
    const i = a.info || {};
    // GPUSupportedLimits exposes its attributes on the prototype, not as own
    // properties, so Object.keys() returns an empty array and reports zero
    // limits on an adapter that has all of them. for-in walks the chain.
    let limitCount = 0;
    for (const _ in a.limits) limitCount += 1;
    return { vendor: i.vendor, architecture: i.architecture, description: i.description,
             limitCount, features: a.features.size };
  });

  const NAMES = ["EXT_disjoint_timer_query", "EXT_disjoint_timer_query_webgl2",
    "EXT_render_snorm", "EXT_texture_norm16", "WEBGL_blend_func_extended",
    "KHR_parallel_shader_compile", "WEBGL_provoking_vertex",
    "WEBGL_render_shared_exponent", "WEBGL_compressed_texture_pvrtc",
    "WEBGL_clip_cull_distance", "OVR_multiview2"];

  for (const ctx of ["webgl", "webgl2"]) {
    await put(ctx, () => {
      const gl = document.createElement("canvas").getContext(ctx);
      if (!gl) return null;
      const dbg = gl.getExtension("WEBGL_debug_renderer_info");
      const L = {};
      for (const k of ["MAX_TEXTURE_SIZE", "MAX_CUBE_MAP_TEXTURE_SIZE",
        "MAX_RENDERBUFFER_SIZE", "MAX_VIEWPORT_DIMS", "MAX_3D_TEXTURE_SIZE",
        "MAX_SAMPLES", "MAX_VERTEX_ATTRIBS", "MAX_VARYING_VECTORS",
        "MAX_TEXTURE_IMAGE_UNITS", "MAX_VERTEX_TEXTURE_IMAGE_UNITS",
        "MAX_COMBINED_TEXTURE_IMAGE_UNITS", "MAX_FRAGMENT_UNIFORM_VECTORS",
        "MAX_VERTEX_UNIFORM_VECTORS", "ALIASED_LINE_WIDTH_RANGE",
        "ALIASED_POINT_SIZE_RANGE"]) {
        if (gl[k] === undefined) continue;
        const v = gl.getParameter(gl[k]);
        L[k] = (Array.isArray(v) || ArrayBuffer.isView(v)) ? Array.from(v) : v;
      }
      // Rule 2: listed is not gettable.
      const objects = {};
      for (const name of NAMES) objects[name] = gl.getExtension(name) ? "object" : "null";
      return {
        renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : null,
        vendor: dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : null,
        version: gl.getParameter(gl.VERSION),
        extCount: (gl.getSupportedExtensions() || []).length,
        exts: (gl.getSupportedExtensions() || []).slice().sort().join(","),
        extObjects: objects,
        limits: L,
      };
    });
  }

  // Rule 1: usable, not merely accepted. Run at the reported maximum and one
  // step past it, so the answer distinguishes "enforces its own claim" from
  // "reports a number it cannot render to".
  await put("allocation", () => {
    const gl = document.createElement("canvas").getContext("webgl2");
    if (!gl) return null;
    const max = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    const out = { reportedMax: max, sizes: {} };
    for (const size of [4096, max, max * 2]) {
      while (gl.getError() !== gl.NO_ERROR) { /* drain */ }
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, size, size);
      const storageErr = gl.getError();
      const fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
      gl.clearColor(0, 1, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.finish();
      const px = new Uint8Array(4);
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      out.sizes[size] = {
        storage: storageErr === gl.NO_ERROR ? "OK" : `0x${storageErr.toString(16)}`,
        fbo: status === gl.FRAMEBUFFER_COMPLETE ? "COMPLETE" : `0x${status.toString(16)}`,
        renders: px[1] === 255,
      };
      gl.deleteFramebuffer(fb);
      gl.deleteTexture(t);
    }
    return out;
  });

  await fetch("/", { method: "POST", body: JSON.stringify(o) });
  document.title = "done";
})();
</script>
</body>
