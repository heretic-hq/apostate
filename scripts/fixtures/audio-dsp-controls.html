<!doctype html>
<meta charset="utf-8">
<title>Native audio DSP isolation controls</title>
<pre id="out">Running audio diagnostics...</pre>
<script>
'use strict';
const query = new URLSearchParams(location.search);
const tokenQuery = new URLSearchParams({token: query.get('token') || ''});
const originalDynamics = {threshold: -50, knee: 40, ratio: 12, attack: 0, release: 0.25};
const heldoutDynamics = {threshold: -28, knee: 12, ratio: 4, attack: 0.005, release: 0.06};

// These cases are fixed before any candidate DSP implementation. PCM stimuli
// use integers divided by powers of two, with no platform transcendental math.
const cases = [
  {id: 'original_chain', role: 'isolation', source: 'oscillator', type: 'triangle',
   frequency: 10000, sampleRate: 44100, length: 44100, dynamics: originalDynamics},
  {id: 'original_chain_repeat', role: 'repeat', source: 'oscillator', type: 'triangle',
   frequency: 10000, sampleRate: 44100, length: 44100, dynamics: originalDynamics},
  {id: 'original_oscillator', role: 'isolation', source: 'oscillator', type: 'triangle',
   frequency: 10000, sampleRate: 44100, length: 44100},
  {id: 'saw_chain_heldout', role: 'heldout', source: 'oscillator', type: 'sawtooth',
   frequency: 731, sampleRate: 24000, length: 16384, dynamics: heldoutDynamics},
  {id: 'saw_oscillator_heldout', role: 'heldout', source: 'oscillator', type: 'sawtooth',
   frequency: 731, sampleRate: 24000, length: 16384},
  {id: 'triangle_chain_heldout', role: 'heldout', source: 'oscillator', type: 'triangle',
   frequency: 997, sampleRate: 48000, length: 16384, dynamics: heldoutDynamics},
  {id: 'triangle_oscillator_heldout', role: 'heldout', source: 'oscillator', type: 'triangle',
   frequency: 997, sampleRate: 48000, length: 16384},
  {id: 'compressor_impulses', role: 'isolation', source: 'pcm', stimulus: 'impulses',
   sampleRate: 44100, length: 16384, dynamics: originalDynamics},
  {id: 'compressor_steps', role: 'isolation', source: 'pcm', stimulus: 'steps',
   sampleRate: 44100, length: 16384, dynamics: originalDynamics},
  {id: 'compressor_sequence', role: 'isolation', source: 'pcm', stimulus: 'xorshift32',
   seed: 305419896, sampleRate: 44100, length: 16384, dynamics: originalDynamics},
  {id: 'compressor_sequence_repeat', role: 'repeat', source: 'pcm', stimulus: 'xorshift32',
   seed: 305419896, sampleRate: 44100, length: 16384, dynamics: originalDynamics},
  {id: 'compressor_stereo_heldout', role: 'heldout', source: 'pcm', stimulus: 'xorshift32',
   seed: 3735928559, channels: 2, sampleRate: 48000, length: 16384,
   dynamics: {...heldoutDynamics, knee: 0, ratio: 3, release: 0.125}},
];

function base64(bytes) {
  let binary = '';
  for (let i = 0; i < bytes.length; i += 16384) {
    binary += String.fromCharCode(...bytes.subarray(i, i + 16384));
  }
  return btoa(binary);
}

async function sha256(bytes) {
  return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)),
                    value => value.toString(16).padStart(2, '0')).join('');
}

async function encodePcm(samples) {
  const buffer = new ArrayBuffer(samples.length * 4);
  const view = new DataView(buffer);
  let sumAbs = 0;
  let peak = 0;
  let nonfinite = 0;
  for (let i = 0; i < samples.length; ++i) {
    const value = samples[i];
    view.setFloat32(i * 4, value, true);
    if (Number.isFinite(value)) {
      sumAbs += Math.abs(value);
      peak = Math.max(peak, Math.abs(value));
    } else {
      ++nonfinite;
    }
  }
  const bytes = new Uint8Array(buffer);
  return {encoding: 'float32-le', frames: samples.length, sha256: await sha256(bytes),
          base64: base64(bytes), sumAbs, peak, nonfinite};
}

function makePcm(config, channel) {
  const data = new Float32Array(config.length);
  if (config.stimulus === 'impulses') {
    for (let i = 0; i < data.length; ++i) {
      if (i % 997 === 0) data[i] = ((i / 997) & 1) ? -0.5 : 0.75;
    }
  } else if (config.stimulus === 'steps') {
    const levels = [0, 1 / 32, 0.5, -0.75, 1 / 16, -1 / 8, 0, 0.25];
    for (let i = 0; i < data.length; ++i) data[i] = levels[(i >>> 11) % levels.length];
  } else if (config.stimulus === 'xorshift32') {
    let state = (config.seed ^ Math.imul(channel, 0x9e3779b9)) >>> 0;
    for (let i = 0; i < data.length; ++i) {
      state ^= state << 13;
      state ^= state >>> 17;
      state ^= state << 5;
      state >>>= 0;
      data[i] = (((state >>> 8) & 65535) - 32768) / 32768;
    }
  } else {
    throw new Error('Unknown PCM stimulus');
  }
  return data;
}

async function renderCase(config) {
  const channels = config.channels || 1;
  const context = new OfflineAudioContext(channels, config.length, config.sampleRate);
  const observed = {
    sampleRate: context.sampleRate,
    renderQuantumSize: typeof context.renderQuantumSize === 'number' ? context.renderQuantumSize : null,
    initialTime: context.currentTime,
  };
  let source;
  const inputs = [];
  if (config.source === 'oscillator') {
    source = context.createOscillator();
    source.type = config.type;
    source.frequency.setValueAtTime(config.frequency, context.currentTime);
  } else {
    const buffer = context.createBuffer(channels, config.length, config.sampleRate);
    for (let channel = 0; channel < channels; ++channel) {
      const samples = makePcm(config, channel);
      buffer.copyToChannel(samples, channel);
      // Read back the actual AudioBuffer inputs, not just generator intent.
      inputs.push(await encodePcm(buffer.getChannelData(channel)));
    }
    source = context.createBufferSource();
    source.buffer = buffer;
  }
  let compressor = null;
  if (config.dynamics) {
    compressor = context.createDynamicsCompressor();
    for (const name of ['threshold', 'knee', 'ratio', 'attack', 'release']) {
      compressor[name].setValueAtTime(config.dynamics[name], context.currentTime);
    }
    observed.compressorChannels = {
      channelCount: compressor.channelCount, channelCountMode: compressor.channelCountMode,
      channelInterpretation: compressor.channelInterpretation,
    };
    source.connect(compressor);
    compressor.connect(context.destination);
  } else {
    source.connect(context.destination);
  }
  source.start(0);
  const buffer = await context.startRendering();
  const output = [];
  for (let channel = 0; channel < buffer.numberOfChannels; ++channel) {
    output.push(await encodePcm(buffer.getChannelData(channel)));
  }
  const result = {id: config.id, config, observed, inputs, output,
                  sampleRate: buffer.sampleRate, length: buffer.length,
                  numberOfChannels: buffer.numberOfChannels,
                  reduction: compressor ? compressor.reduction : null};
  if (config.id === 'original_chain' || config.id === 'original_chain_repeat') {
    const samples = buffer.getChannelData(0);
    const nativeBytes = new Uint8Array(samples.buffer, samples.byteOffset, samples.byteLength);
    const slice = samples.subarray(4000, 6000);
    // Exact collector fields, calculated from the original graph output.
    result.collectorComparison = {
      full_sha256: await sha256(nativeBytes), slice_start: 4000,
      slice_base64: base64(new Uint8Array(slice.buffer, slice.byteOffset, slice.byteLength)),
      slice_sum: Array.prototype.reduce.call(slice, (sum, value) => sum + Math.abs(value), 0),
    };
  }
  source.disconnect();
  if (compressor) compressor.disconnect();
  return result;
}

async function report(result) {
  const payload = JSON.stringify(result);
  if (new TextEncoder().encode(payload).length > 7 * 1024 * 1024) {
    throw new Error('Diagnostic exceeds 7 MiB fixture budget');
  }
  document.querySelector('#out').textContent = JSON.stringify({
    diagnosticOnly: true, cases: result.cases?.map(item => ({id: item.id,
      hashes: item.output?.map(channel => channel.sha256), error: item.error})),
    passed: result.passed, error: result.error,
  }, null, 2);
  if (query.get('report') === '1') {
    const response = await fetch('/result?' + tokenQuery, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: payload,
    });
    if (!response.ok) throw new Error('Result POST failed: ' + response.status);
  }
  return result;
}

window.audioDspControlsPromise = (async () => {
  const result = {diagnosticOnly: true, corpusAdmission: false, fixtureVersion: 1,
                  passed: false, cases: [], checks: [], environment: {}};
  try {
    result.environment = {
      userAgent: navigator.userAgent, platform: navigator.platform,
      webdriver: navigator.webdriver, secureContext: isSecureContext,
      littleEndianTypedArrays: new Uint8Array(new Uint32Array([0x01020304]).buffer)[0] === 4,
      fftImplementation: {observed: null, reason: 'No public WebAudio API reports the selected FFT implementation'},
    };
    if (navigator.userAgentData) {
      result.environment.userAgentData = await navigator.userAgentData.getHighEntropyValues([
        'architecture', 'bitness', 'uaFullVersion', 'fullVersionList', 'platformVersion', 'model',
      ]);
    }
    for (const config of cases) {
      try { result.cases.push(await renderCase(config)); }
      catch (error) { result.cases.push({id: config.id, config, error: String(error)}); }
    }
    for (const [first, second] of [['original_chain', 'original_chain_repeat'],
                                  ['compressor_sequence', 'compressor_sequence_repeat']]) {
      const a = result.cases.find(item => item.id === first);
      const b = result.cases.find(item => item.id === second);
      result.checks.push({name: first + ' repeats exactly', passed: !!a.output && !!b.output &&
        a.output.every((channel, index) => channel.sha256 === b.output[index]?.sha256)});
    }
    result.passed = result.cases.every(item => !item.error && item.output.every(channel => !channel.nonfinite)) &&
      result.checks.every(check => check.passed);
  } catch (error) {
    result.error = String(error);
  }
  return report(result);
})().catch(error => report({diagnosticOnly: true, corpusAdmission: false,
                            passed: false, error: String(error)}));
</script>
