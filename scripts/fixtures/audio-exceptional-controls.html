<!doctype html>
<meta charset="utf-8">
<title>Offline WebAudio exceptional-input controls</title>
<pre id="out">Running offline controls</pre>
<script>
'use strict';
const query = new URLSearchParams(location.search);
function b64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 16384) s += String.fromCharCode(...bytes.subarray(i, i + 16384));
  return btoa(s);
}
async function encode(data) {
  // Copy bytes, never read a NaN through a JS Number to serialize its payload.
  const bytes = new Uint8Array(data.buffer, data.byteOffset, data.byteLength).slice();
  const words = new Uint32Array(bytes.buffer);
  let nan = 0, infinity = 0, zero = 0;
  const payloadCounts = {};
  for (const w of words) {
    const magnitude = w & 0x7fffffff;
    if (magnitude > 0x7f800000) { ++nan; const key = w.toString(16).padStart(8, '0'); payloadCounts[key] = (payloadCounts[key] || 0) + 1; }
    else if (magnitude === 0x7f800000) ++infinity;
    else if (magnitude === 0) ++zero;
  }
  const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
  return {encoding: 'float32-host-bytes', littleEndian: new Uint8Array(new Uint32Array([1]).buffer)[0] === 1,
    frames: data.length, sha256: Array.from(hash, x => x.toString(16).padStart(2, '0')).join(''),
    base64: b64(bytes), nan, infinity, zero, nanPayloadCounts: payloadCounts};
}
function fillBits(data, kind, offset = 0) {
  const words = new Uint32Array(data.buffer, data.byteOffset, data.length);
  if (kind === 'identity') { data[offset] = 1; return; }
  if (kind === 'finite') { for (let i = offset; i < data.length; ++i) data[i] = ((i * 17 % 31) - 15) / 64; return; }
  const patterns = {qnan: [0x7fc12345, 0xffc23456], snan: [0x7f812345, 0xff823456],
    infinity: [0x7f800000, 0xff800000], max: [0x7f7fffff, 0xff7fffff]};
  const pattern = patterns[kind];
  for (let i = offset; i < data.length; ++i) words[i] = pattern[(i - offset) % pattern.length];
}
const cases = [];
for (const api of ['factory', 'constructor']) {
  for (const kind of ['qnan', 'snan', 'infinity', 'max']) {
    for (const normalize of (kind === 'max' ? [false, true] : [false])) {
      cases.push({id: `periodic_${api}_${kind}_${normalize}`, path: 'periodic', api, kind, normalize});
    }
  }
}
for (const kind of ['qnan', 'snan', 'infinity', 'max']) {
  cases.push({id: `direct_${kind}`, path: 'direct', kind});
  for (const normalize of [false, true]) cases.push({id: `ir_${kind}_${normalize}`, path: 'convolver', ir: kind, input: 'identity', normalize});
  cases.push({id: `signal_${kind}`, path: 'convolver', ir: 'identity', input: kind, normalize: false});
}
cases.push({id: 'convolver_finite_control', path: 'convolver', ir: 'finite', input: 'finite', normalize: false});
cases.push({id: 'ir_qnan_repeat', path: 'convolver', ir: 'qnan', input: 'identity', normalize: false});
async function run(config) {
  const result = {config, accepted: false, inputs: {}};
  const context = new OfflineAudioContext(1, 8192, 44100);
  try {
    if (config.path === 'periodic') {
      const real = new Float32Array(65), imag = new Float32Array(65);
      fillBits(imag, config.kind, 1);
      result.inputs.real = await encode(real); result.inputs.imag = await encode(imag);
      const options = {disableNormalization: !config.normalize};
      const wave = config.api === 'factory' ? context.createPeriodicWave(real, imag, options)
        : new PeriodicWave(context, {...options, real, imag});
      const oscillator = new OscillatorNode(context, {frequency: 1000});
      oscillator.setPeriodicWave(wave); oscillator.connect(context.destination); oscillator.start();
    } else {
      const buffer = context.createBuffer(1, 8192, 44100);
      fillBits(buffer.getChannelData(0), config.path === 'direct' ? config.kind : config.input);
      result.inputs.signal = await encode(buffer.getChannelData(0));
      const source = new AudioBufferSourceNode(context, {buffer});
      if (config.path === 'direct') source.connect(context.destination);
      else {
        const ir = context.createBuffer(1, 2048, 44100);
        // Put all response energy past the direct-convolution prefix.
        fillBits(ir.getChannelData(0), config.ir, 512);
        result.inputs.ir = await encode(ir.getChannelData(0));
        const convolver = new ConvolverNode(context, {disableNormalization: !config.normalize});
        convolver.buffer = ir;
        result.irReadback = await encode(convolver.buffer.getChannelData(0));
        source.connect(convolver); convolver.connect(context.destination);
      }
      source.start();
    }
    result.accepted = true;
    const rendered = await context.startRendering();
    result.output = await encode(rendered.getChannelData(0));
  } catch (error) { result.error = {name: error.name, message: error.message}; }
  return result;
}
(async () => {
  const results = [];
  for (const config of cases) results.push(await run(config));
  const data = {diagnosticOnly: true, corpusAdmission: false, fixture: 'audio-exceptional-controls-v1',
    userAgent: navigator.userAgent, platform: navigator.platform, sampleRate: 44100, results};
  document.getElementById('out').textContent = JSON.stringify(results.map(x => ({id:x.config.id, accepted:x.accepted, error:x.error, nan:x.output?.nan})), null, 2);
  if (query.get('report') === '1') await fetch('/result?' + new URLSearchParams({token:query.get('token') || ''}), {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
})().catch(async error => {
  await fetch('/result?' + new URLSearchParams({token:query.get('token') || ''}), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({fatal:String(error)})});
});
</script>
