<!doctype html>
<meta charset="utf-8">
<title>Barcode decoder compatibility control</title>
<pre id="out">Comparing native barcode results...</pre>
<script>
const query=new URLSearchParams(location.search);
const auth=new URLSearchParams({token:query.get('token')||''});
const bounded=(promise,label)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timeout')),15000))]);
function encode(bytes){let s='';for(let i=0;i<bytes.length;i+=16384)s+=String.fromCharCode(...bytes.subarray(i,i+16384));return btoa(s);}
function normalized(barcodes){return barcodes.map(b=>({rawValue:b.rawValue,format:b.format,boundingBox:{x:b.boundingBox.x,y:b.boundingBox.y,width:b.boundingBox.width,height:b.boundingBox.height},cornerPoints:b.cornerPoints.map(p=>({x:p.x,y:p.y}))}));}
function canvas(width,height){const c=document.createElement('canvas');c.width=width;c.height=height;const g=c.getContext('2d',{willReadFrequently:true});g.fillStyle='white';g.fillRect(0,0,width,height);g.imageSmoothingEnabled=false;return c;}
function transformed(image,angle,left=0,top=0){
  const swap=angle===90||angle===270,w=swap?image.height:image.width,h=swap?image.width:image.height;
  const c=canvas(w+left+(left?24:0),h+top+(top?16:0)),g=c.getContext('2d');
  const shifts={0:[left,top],90:[left+image.height,top],180:[left+image.width,top+image.height],270:[left,top+image.width]};
  g.translate(...shifts[angle]);g.rotate(angle*Math.PI/180);g.drawImage(image,0,0);g.setTransform(1,0,0,1,0,0);return c;
}
async function measure(c,name,detector){
  const g=c.getContext('2d'),pixels=g.getImageData(0,0,c.width,c.height),gray=new Uint8Array(c.width*c.height);
  for(let i=0;i<gray.length;i++){const j=i*4,v=(2*pixels.data[j]+5*pixels.data[j+1]+pixels.data[j+2])>>3;gray[i]=v;pixels.data[j]=pixels.data[j+1]=pixels.data[j+2]=v;pixels.data[j+3]=255;}
  // Native Vision and standalone ZXing consume these same opaque gray pixels.
  g.putImageData(pixels,0,0);
  const sha256=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',gray)),v=>v.toString(16).padStart(2,'0')).join('');
  const repeats=[];
  for(let i=0;i<3;i++)repeats.push(normalized(await bounded(detector.detect(c),name)));
  return {name,width:c.width,height:c.height,grayBase64:encode(gray),graySha256:sha256,native:repeats[0],nativeRepeats:repeats,repeatStable:repeats.every(r=>JSON.stringify(r)===JSON.stringify(repeats[0]))};
}
(async()=>{
  const result={diagnostic_only:true,corpus_admission:false,userAgent:navigator.userAgent,secureContext:isSecureContext,barcodeDetectorPresent:typeof BarcodeDetector!=='undefined',scenes:[]};
  try{
    if(!result.barcodeDetectorPresent)throw new Error('Native BarcodeDetector unavailable');
    result.supportedFormats=await bounded(BarcodeDetector.getSupportedFormats(),'formats');
    const params=await (await fetch('/parameters?'+auth)).json();
    const images=[];
    for(const fixture of params.fixtures){const image=new Image();image.src='data:image/png;base64,'+fixture.pngBase64;await bounded(image.decode(),'PNG decode');images.push({fixture,image});}
    const detector=new BarcodeDetector();
    for(const {fixture,image} of images){
      for(const angle of [0,90,180,270])result.scenes.push(await measure(transformed(image,angle),fixture.name+'-r'+angle,detector));
      result.scenes.push(await measure(transformed(image,0,32,48),fixture.name+'-offset',detector));
    }
    result.scenes.push(await measure(canvas(100,100),'blank',detector));
    const combined=canvas(images.reduce((s,x)=>s+x.image.width+32,32),Math.max(...images.map(x=>x.image.height))+64);
    let x=32;for(const {image} of images){combined.getContext('2d').drawImage(image,x,32);x+=image.width+32;}
    result.scenes.push(await measure(combined,'mixed-offset',detector));
    result.passed=result.scenes.every(s=>s.repeatStable);
  }catch(error){result.error=String(error.stack||error);result.passed=false;}
  document.querySelector('#out').textContent=JSON.stringify({...result,scenes:result.scenes.map(({grayBase64,...s})=>s)},null,2);
  if(query.get('report')==='1')await fetch('/result?'+auth,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});
})();
</script>
