<!doctype html>
<meta charset="utf-8">
<title>Native display fullscreen control</title>
<pre id="out">Measuring fullscreen geometry...</pre>
<script>
(async () => {
  const snapshot = () => ({x: screenX, y: screenY, width: innerWidth, height: innerHeight,
    outerWidth, outerHeight, devicePixelRatio});
  const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
  const result = {diagnosticOnly: true, corpusAdmission: false, passed: false,
    scope: 'native window fullscreen bounds and restoration; content UI insets recorded separately',
    permissions: 'pregranted window-management and automatic-fullscreen'};
  try {
    // Let ordinary browser chrome finish its startup layout before comparing
    // the restored viewport. The control does not suppress browser infobars.
    await delay(1000);
    result.before = snapshot();
    const details = await getScreenDetails();
    const target = details.screens[details.screens.length - 1];
    result.target = {left: target.left, top: target.top, width: target.width,
      height: target.height, devicePixelRatio: target.devicePixelRatio, label: target.label};
    await document.documentElement.requestFullscreen({screen: target});
    for (let n = 0; n < 100; n++) {
      await delay(20);
      if (outerWidth === target.width && outerHeight === target.height &&
          details.currentScreen.left === target.left && details.currentScreen.top === target.top) break;
    }
    result.fullscreen = snapshot();
    result.hasFullscreenElement = document.fullscreenElement === document.documentElement;
    result.currentScreen = {left: details.currentScreen.left, top: details.currentScreen.top};
    // Browser UI can retain an infobar under this diagnostic's launch flags.
    // Verify the native window bounds, without suppressing or hiding that UI.
    result.contentInsets = {width: outerWidth - innerWidth, height: outerHeight - innerHeight};
    result.fullscreenPassed = result.hasFullscreenElement && outerWidth === target.width &&
      outerHeight === target.height && devicePixelRatio === target.devicePixelRatio &&
      result.currentScreen.left === target.left && result.currentScreen.top === target.top;
    await document.exitFullscreen();
    for (let n = 0; n < 100; n++) {
      await delay(20);
      if (['x', 'y', 'outerWidth', 'outerHeight', 'devicePixelRatio'].every(
          key => snapshot()[key] === result.before[key])) break;
    }
    result.restored = snapshot();
    result.contentViewportRestored = result.restored.width === result.before.width &&
      result.restored.height === result.before.height;
    result.restorePassed = !document.fullscreenElement &&
      ['x', 'y', 'outerWidth', 'outerHeight', 'devicePixelRatio'].every(
        key => result.restored[key] === result.before[key]);
    result.passed = result.fullscreenPassed && result.restorePassed;
  } catch (error) { result.error = String(error); }
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
  const query = new URLSearchParams(location.search);
  if (query.get('report') === '1') {
    const response = await fetch('/result?' + new URLSearchParams({token: query.get('token') || ''}), {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)});
    if (!response.ok) throw new Error('Result POST failed: ' + response.status);
  }
})();
</script>
