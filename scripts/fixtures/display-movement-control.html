<!doctype html>
<meta charset="utf-8">
<title>Native display movement control</title>
<pre id="out">Measuring window movement...</pre>
<script>
const query = new URLSearchParams(location.search);
const auth = new URLSearchParams({token: query.get('token') || ''});
const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
const screenInfo = screen => Object.fromEntries([
  'left', 'top', 'width', 'height', 'availLeft', 'availTop', 'availWidth', 'availHeight',
  'devicePixelRatio', 'label', 'isPrimary', 'isInternal'
].map(key => [key, screen[key]]));

if (!query.has('child')) (async () => {
  const result = {diagnosticOnly: true, corpusAdmission: false, passed: false, moves: []};
  let popup;
  try {
    const details = await getScreenDetails();
    result.screens = details.screens.map(screenInfo);
    if (details.screens.length < 2) throw new Error('Movement control requires two displays');
    const childQuery = new URLSearchParams(auth);
    childQuery.set('child', '1');
    const childURL = new URL('/?' + childQuery, location.href).href;
    popup = window.open(childURL, '_blank', 'popup,width=400,height=300');
    if (!popup) throw new Error('Popup was blocked');
    for (let n = 0; n < 100 && (popup.location.href !== childURL ||
         popup.document.readyState !== 'complete'); n++) {
      await delay(20);
    }
    if (popup.location.href !== childURL || popup.document.readyState !== 'complete') {
      throw new Error('Popup navigation did not complete');
    }
    const childDetails = await popup.getScreenDetails();
    for (const target of [...details.screens, details.screens[0]]) {
      const x = target.availLeft + 100;
      const y = target.availTop + 100;
      popup.moveTo(x, y);
      // Screen change delivery is asynchronous. Record a bounded settled view.
      for (let n = 0; n < 100; n++) {
        await delay(20);
        if (childDetails.currentScreen.left === target.left &&
            childDetails.currentScreen.top === target.top &&
            popup.screenX === x && popup.screenY === y) break;
      }
      const current = screenInfo(childDetails.currentScreen);
      const actual = {screenX: popup.screenX, screenY: popup.screenY,
        width: popup.screen.width, height: popup.screen.height,
        availLeft: popup.screen.availLeft, availTop: popup.screen.availTop,
        devicePixelRatio: popup.devicePixelRatio};
      result.moves.push({requested: {x, y, screen: screenInfo(target)}, current, actual,
        passed: current.left === target.left && current.top === target.top &&
          actual.screenX === x && actual.screenY === y &&
          actual.width === target.width && actual.height === target.height &&
          actual.devicePixelRatio === target.devicePixelRatio});
    }
    result.passed = result.moves.every(move => move.passed);
  } catch (error) { result.error = String(error); }
  finally { if (popup && !popup.closed) popup.close(); }
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
  if (query.get('report') === '1') {
    const response = await fetch('/result?' + auth, {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)});
    if (!response.ok) throw new Error('Result POST failed: ' + response.status);
  }
})();
</script>
