<!doctype html><meta charset="utf-8"><title>Extension context control</title>
<pre id="out">Reading the isolated page context...</pre>
<script>
(async () => {
  const startQuery = new URLSearchParams(location.search);
  if (!startQuery.has('settled')) {
    // Extension installation at first browser startup is asynchronous. Visit
    // the page again after startup; both control arms take the same route.
    await new Promise(resolve => setTimeout(resolve, 5000));
    const target = new URL(location.href);
    target.searchParams.set('settled', '1');
    location.replace(target);
    return;
  }
  await new Promise(resolve => setTimeout(resolve, 2000));
  await document.fonts.ready;
  const names = ['SENTRY_RELEASE', '_phantomHideProvidersArray', '_sentryDebugIdIdentifier',
    '_sentryDebugIds', 'browser', 'define', 'ethereum', 'isPhantomInstalled', 'phantom', 'solana'];
  const result = {diagnosticOnly: true, corpusAdmission: false,
    ownKeys: Object.getOwnPropertyNames(window).sort(),
    referenceGlobals: Object.fromEntries(names.map(name => [name, typeof window[name]])),
    chromeKeys: window.chrome ? Object.getOwnPropertyNames(chrome).sort() : [],
    runtimeKeys: window.chrome?.runtime ? Object.getOwnPropertyNames(chrome.runtime).sort() : [],
    fontFaces: [...document.fonts].map(face => ({family: face.family, style: face.style,
      weight: face.weight, status: face.status})),
    secureContext: isSecureContext, userAgent: navigator.userAgent,
    walletMethodsInvoked: false};
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
  const query = new URLSearchParams(location.search);
  const response = await fetch('/result?' + new URLSearchParams({token: query.get('token') || ''}),
    {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)});
  if (!response.ok) throw new Error('Result upload failed');
})();
</script>
