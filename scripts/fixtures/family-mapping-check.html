<!doctype html>
<meta charset="utf-8">
<title>Family mapping check</title>
<pre id="out">Probing...</pre>
<script>
// Same span via generic monospace vs explicit Consolas: if tops differ, the
// generic mapping resolves differently in layout than in canvas.
(async () => {
  const result = {diagnosticOnly: true, corpusAdmission: false, rows: []};
  try {
    const host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden;font-size:0';
    host.innerHTML =
      '<div><span style="font:24px monospace">Apostate mLj</span></div>' +
      '<div><span style="font:24px Consolas">Apostate mLj</span></div>' +
      '<div style="font:24px monospace"><span>Apostate mLj</span></div>';
    document.body.appendChild(host);
    const ctx = document.createElement('canvas').getContext('2d');
    host.querySelectorAll('span').forEach((el) => {
      const r = el.getBoundingClientRect();
      const cs = getComputedStyle(el);
      ctx.font = cs.font;
      const m = ctx.measureText('Apostate mLj');
      result.rows.push({style: el.getAttribute('style') || '(inherit)',
        usedFont: m.font || null, top: r.top, height: r.height,
        boxA: m.fontBoundingBoxAscent, width: m.width});
    });
    host.remove();
  } catch (error) { result.error = String(error); }
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
  const query = new URLSearchParams(location.search);
  if (query.get('report') === '1') {
    const response = await fetch('/result?' + new URLSearchParams({token: query.get('token') || ''}), {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)
    });
    if (!response.ok) throw new Error('Result POST failed: ' + response.status);
  }
})();
</script>
