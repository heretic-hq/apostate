<!doctype html>
<meta charset="utf-8">
<title>First-line origin bisect</title>
<pre id="out">Probing...</pre>
<script>
// V3's exact host (inline content first, no strut block), varying only the
// block font that builds the strut. If the +2px first-line offset moves with
// the strut, it is baseline/strut-driven; if it is rock-solid, it is layout.
(async () => {
  const result = {diagnosticOnly: true, corpusAdmission: false, variants: []};
  try {
    const inner = '<span style="font:24px monospace">Apostate mLj</span>' +
      '<span style="font:18px serif">W_i_d_t_h</span>';
    for (const blockFont of ['16px "Times New Roman"', '16px Arial',
                             '16px Consolas', '0px serif', '24px monospace']) {
      const host = document.createElement('div');
      host.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden;font:' + blockFont;
      host.innerHTML = inner;
      document.body.appendChild(host);
      const tops = [];
      host.querySelectorAll('span').forEach((el) => {
        const r = el.getBoundingClientRect();
        tops.push({top: r.top, height: r.height,
          lineHeight: getComputedStyle(el).lineHeight});
      });
      result.variants.push({blockFont, hostTop: host.getBoundingClientRect().top, tops});
      host.remove();
    }
  } catch (error) { result.error = String(error); }
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
  const query = new URLSearchParams(location.search);
  if (query.get('report') === '1') {
    const response = await fetch('/result?' + new URLSearchParams({token: query.get('token') || ''}), {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)
    });
    if (!response.ok) throw new Error('Result POST failed: ' + response.status);
  }
})();
</script>
