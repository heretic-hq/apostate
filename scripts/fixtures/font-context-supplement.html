<!doctype html>
<meta charset="utf-8">
<title>Supplemental font context</title>
<style>body{margin:0;padding:24px;font:15px/1.55 system-ui,-apple-system,sans-serif}pre{white-space:pre-wrap}</style>
<pre id="out">Collecting supplemental font context...</pre>
<script>
// A separate diagnostic, not a collector revision or a corpus admission.
// No FontFace.load(), remote fetch, font binary export or extension inventory.
const query=new URLSearchParams(location.search);
const auth=new URLSearchParams({token:query.get('token')||''});
const limit=(value,n=512)=>String(value??'').slice(0,n);
function cssUnescape(value){return value.replace(/\\(?:([0-9a-f]{1,6})(?:\r\n|[\t\n\f\r ])?|([\s\S]))/gi,(_,hex,char)=>hex?String.fromCodePoint(Math.min(parseInt(hex,16)||65533,1114111)):/[\r\n\f]/.test(char)?'':char);}
function safeURL(value,base=document.baseURI){
  try{const u=new URL(cssUnescape(value),base);if(!['http:','https:'].includes(u.protocol))return '[non-http source omitted]';u.username='';u.password='';u.search='';u.hash='';return limit(u.href,2048);}
  catch{return '[unparseable source omitted]';}
}
function sourceDescriptors(value,base){
  const result=[],pattern=/(url|local)\(\s*(?:"((?:\\[\s\S]|[^"\\])*)"|'((?:\\[\s\S]|[^'\\])*)'|([^)]*?))\s*\)/gi;
  for(const m of value.matchAll(pattern)){
    const kind=m[1].toLowerCase(),raw=m[2]??m[3]??m[4];
    result.push({kind,value:kind==='url'?safeURL(raw,base):limit(cssUnescape(raw),256)});
    if(result.length===32)break;
  }
  return result;
}
function faceSnapshot(){
  const faces=[];
  for(const f of document.fonts){if(faces.length===256)break;const item={};for(const k of ['family','style','weight','stretch','status','unicodeRange','variationSettings','featureSettings','display','ascentOverride','descentOverride','lineGapOverride'])item[k]=limit(f[k]);faces.push(item);}
  return {size:document.fonts.size,status:document.fonts.status,faces,truncated:document.fonts.size>faces.length};
}
function rulesSnapshot(){
  const result={fontFaces:[],inaccessible:0,visitedRules:0,truncated:false},seen=new Set();
  function sheet(s,depth){if(!s||seen.has(s))return;if(depth>8||seen.size>=128){result.truncated=true;return;}seen.add(s);let rules;try{rules=s.cssRules;}catch{result.inaccessible++;return;}walk(rules,s.href||document.baseURI,depth);}
  function walk(rules,base,depth){if(depth>8){result.truncated=true;return;}for(const rule of rules){
    if(++result.visitedRules>4096||result.fontFaces.length>=256){result.truncated=true;return;}
    if(rule.type===CSSRule.FONT_FACE_RULE){
      const item={stylesheet:safeURL(base),descriptors:{},sources:sourceDescriptors(rule.style.getPropertyValue('src'),base)};
      for(const key of ['font-family','font-style','font-weight','font-stretch','font-display','unicode-range','font-feature-settings','font-variation-settings','ascent-override','descent-override','line-gap-override'])item.descriptors[key]=limit(rule.style.getPropertyValue(key));
      result.fontFaces.push(item);
    }else if(rule.type===CSSRule.IMPORT_RULE){sheet(rule.styleSheet,depth+1);}
    else {try{if(rule.cssRules)walk(rule.cssRules,base,depth+1);}catch{result.inaccessible++;}}
  }}
  for(const s of document.styleSheets){sheet(s,0);if(result.truncated)break;}
  return result;
}
const rect=r=>({x:r.x,y:r.y,width:r.width,height:r.height,top:r.top,right:r.right,bottom:r.bottom,left:r.left});
function style(node){const cs=getComputedStyle(node),out={};for(const k of ['font','fontFamily','fontSize','fontStyle','fontWeight','fontStretch','lineHeight','verticalAlign','display','marginTop','marginBottom','paddingTop','paddingBottom','borderTopWidth','borderBottomWidth','writingMode','transform','zoom'])out[k]=cs[k];return out;}
function ready(font,sample){try{return document.fonts.check(font,sample);}catch{return false;}}
const originalHTML='<span style="font:24px monospace">Apostate mLj</span>'+
 '<span style="font:18px serif">W_i_d_t_h</span>'+
 '<span style="font:italic 700 15px \'Times New Roman\',serif">gQÅ字</span>'+
 '<div style="display:inline-block;width:3.7em;font:12px sans-serif">x</div>';
const originalNeeds=[['24px monospace','Apostate mLj'],['18px serif','W_i_d_t_h'],['italic 700 15px "Times New Roman",serif','gQÅ字'],['12px sans-serif','x']];
const marker='<span data-baseline="yes" style="display:inline-block;width:0;height:0;padding:0;margin:0;border:0;font:0px/0 sans-serif;vertical-align:baseline"></span>';
function child(node){return {bounds:rect(node.getBoundingClientRect()),clientRects:Array.from(node.getClientRects(),rect),style:style(node)};}
function originalControl(twoLines){
  if(!originalNeeds.every(([f,t])=>ready(f,t)))return {skipped:'A required declared font is not loaded; measurement omitted to avoid loading it.'};
  const host=document.createElement('div');host.style.cssText='position:absolute;left:-10000px;top:0;visibility:hidden';
  host.innerHTML=twoLines?originalHTML+marker+'<br>'+originalHTML+marker:originalHTML;document.body.append(host);
  const markers=Array.from(host.querySelectorAll('[data-baseline]'),e=>e.getBoundingClientRect().top);
  const result={host:child(host),children:Array.from(host.querySelectorAll('span:not([data-baseline]),div'),child),baselines:markers,baselineAdvance:markers.length===2?markers[1]-markers[0]:null};
  host.remove();return result;
}
function isolatedLeading(family,size){
  const cssName=family==='monospace'?family:JSON.stringify(family),font=`${size}px ${cssName}`,sample='Apostate mLj';
  if(!ready(font,sample))return {family,size,skipped:'Declared font not loaded'};
  const host=document.createElement('div');host.style.cssText=`all:initial;position:absolute;left:-10000px;top:0;visibility:hidden;display:block;width:max-content;white-space:nowrap;font:${font};line-height:normal;padding:0;margin:0;border:0;`;
  const first=document.createElement('span'),second=document.createElement('span');first.textContent=second.textContent=sample;first.style.cssText=second.style.cssText='font:inherit;line-height:inherit;vertical-align:baseline';
  host.append(first);host.insertAdjacentHTML('beforeend',marker+'<br>');host.append(second);host.insertAdjacentHTML('beforeend',marker);document.body.append(host);
  const baselines=Array.from(host.querySelectorAll('[data-baseline]'),e=>e.getBoundingClientRect().top),firstBox=rect(first.getBoundingClientRect());
  const result={family,size,sample,host:child(host),first:child(first),second:child(second),baselines,baselineAdvance:baselines[1]-baselines[0],advanceMinusFontBox:baselines[1]-baselines[0]-firstBox.height};
  host.remove();return result;
}
(async()=>{
  const result={diagnosticOnly:true,corpusAdmission:false,diagnostic_only:true,corpus_admission:false,page:safeURL(location.href),userAgent:navigator.userAgent,devicePixelRatio,language:navigator.language};
  try{
    result.fontFacesBefore=faceSnapshot();result.accessibleRules=rulesSnapshot();result.bodyStyle=style(document.body);
    const sanitizers=[
      safeURL('https://user:password@example.test/font.woff2?token=secret#fragment')==='https://example.test/font.woff2',
      safeURL('data:font/woff2;base64,AAAA')==='[non-http source omitted]',
      safeURL('blob:https://example.test/identifier')==='[non-http source omitted]',
      safeURL('chrome-extension://example/fonts/font.woff2')==='[non-http source omitted]',
      sourceDescriptors('url("https://user:password@example.test/a.woff2?token=secret#f") format("woff2")','https://example.test/')[0].value==='https://example.test/a.woff2',
      safeURL(String.raw`https\3a //user\3a password@example.test/a.woff2\3f token=secret\23 fragment`)==='https://example.test/a.woff2'
    ];
    result.sanitizerChecksPassed=sanitizers.every(Boolean);
    result.originalClientrects=originalControl(false);result.twoLineClientrects=originalControl(true);
    result.isolatedLeading=[];for(const family of ['Consolas','monospace'])for(const size of [12,24,40,72])result.isolatedLeading.push(isolatedLeading(family,size));
    result.metrics=[];const c=document.createElement('canvas'),g=c.getContext('2d');
    for(const family of ['Noto Sans','Roboto','Arial Narrow','Arial','Consolas','Times New Roman','Segoe UI'])for(const size of [14,24,40,72])for(const sample of ['HxpgÅ','字','HxpgÅ字','mmmmmmmmmmlli','mmmmmmmmmmlli字']){
      const font=`${size}px ${JSON.stringify(family)}`;
      if(!ready(font,sample)){result.metrics.push({family,size,sample,skipped:'Declared font not loaded'});continue;}
      g.font=font;const m=g.measureText(sample),values={};for(const k of ['width','actualBoundingBoxLeft','actualBoundingBoxRight','actualBoundingBoxAscent','actualBoundingBoxDescent','fontBoundingBoxAscent','fontBoundingBoxDescent','hangingBaseline','ideographicBaseline'])values[k]=m[k];
      result.metrics.push({family,size,sample,requestedFont:g.font,metrics:values});
    }
    result.fontFacesAfter=faceSnapshot();
    result.mechanics={originalChildCount:result.originalClientrects.children?.length??null,twoLineChildCount:result.twoLineClientrects.children?.length??null,isolatedControls:result.isolatedLeading.length,metricRows:result.metrics.length,skippedMetricRows:result.metrics.filter(r=>r.skipped).length};
    result.passed=result.sanitizerChecksPassed && result.metrics.length===140 && result.isolatedLeading.length===8 &&
      (Boolean(result.originalClientrects.skipped)||result.mechanics.originalChildCount===4) &&
      (Boolean(result.twoLineClientrects.skipped)||(result.mechanics.twoLineChildCount===8 && result.twoLineClientrects.baselineAdvance>0));
  }catch(error){result.errorName=error.name;result.passed=false;}
  document.querySelector('#out').textContent=JSON.stringify(result,null,2);
  if(query.get('report')==='1')await fetch('/result?'+auth,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});
})();
</script>
