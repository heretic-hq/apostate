<!doctype html>
<meta charset="utf-8">
<title>Font path precision diagnostic</title>
<pre id="out">Running…</pre>
<script>
// These are authored diagnostics, not additions to the capture collector.
// A family name does not establish the underlying file, face or glyph provider.
window.fontPathPrecisionResultPromise = (async () => {
  const query = new URLSearchParams(location.search);
  const parametersResponse = await fetch('/parameters?' + new URLSearchParams({token: query.get('token') || ''}));
  const supplied = parametersResponse.ok ? await parametersResponse.json() : {};
  const families = supplied.families || ['Songti SC', 'Arial', 'PingFang SC', 'Noto Sans', 'October India'];
  const sizes = supplied.sizes || [1.5, 3, 4, 8, 12, 18, 24, 40, 63.5, 128];
  const samples = supplied.samples || ['字', 'HxpgÅ', 'é', 'क'];
  const styles = supplied.styles || ['normal', 'italic', 'bold'];
  const fields = ['width', 'actualBoundingBoxLeft', 'actualBoundingBoxRight',
    'actualBoundingBoxAscent', 'actualBoundingBoxDescent',
    'fontBoundingBoxAscent', 'fontBoundingBoxDescent'];
  await document.fonts.ready;
  const canvas = document.createElement('canvas').getContext('2d');
  const offscreen = new OffscreenCanvas(400, 150).getContext('2d');
  const rows = [];
  const read = (context, font, sample) => {
    context.font = font;
    const result = context.measureText(sample);
    return Object.fromEntries(fields.map(field => [field, result[field]]));
  };
  const same = (a, b) => fields.every(field => Object.is(a[field], b[field]));
  for (const family of families) for (const size of sizes)
    for (const style of styles) for (const sample of samples) {
      const font = `${style} ${size}px ${JSON.stringify(family)}`;
      const cold = read(canvas, font, sample);
      const offscreenMetrics = read(offscreen, font, sample);
      // Interleave other sizes and styles before checking repeatability.
      read(canvas, `bold ${size + 0.375}px monospace`, 'gxÅ');
      const warm = read(canvas, font, sample);
      rows.push({family, size, style, sample, fontAccepted: canvas.font,
        cold, warm, offscreen: offscreenMetrics,
        stable: same(cold, warm), offscreenMatches: same(cold, offscreenMetrics)});
    }
  return {diagnosticOnly: true, corpusAdmission: false, rows,
    consistencyPassed: rows.every(row => row.stable && row.offscreenMatches),
    nativeEqualityTested: false, physicalFaceIdentityVerified: false};
})().then(report, error => report({diagnosticOnly: true, corpusAdmission: false, error: String(error)}));
async function report(result) {
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
  const query = new URLSearchParams(location.search);
  if (query.get('report') === '1') {
    const response = await fetch('/result?' + new URLSearchParams({token: query.get('token') || ''}), {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)
    });
    if (!response.ok) throw new Error('Result POST failed: ' + response.status);
  }
  return result;
}
</script>
