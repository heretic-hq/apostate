<!doctype html>
<meta charset="utf-8">
<title>Native font metric policy check</title>
<pre id="out">Running...</pre>
<script>
// Run the same file with no profile, Windows profile and Mac profile before/after.
// Family names and document.fonts.check do not establish physical face identity.
window.fontPolicyResultPromise = (async () => {
  await document.fonts.ready;
  const families = ['Consolas', 'Arial', 'Times New Roman', 'Helvetica', 'Menlo'];
  const sizes = [1.5, 3, 4, 8, 12, 15, 18, 24, 40, 63.5];
  const samples = ['HxpgÅ', '字', 'HxpgÅ字', 'x\u0301g\u0323'];
  const fields = ['width', 'fontBoundingBoxAscent', 'fontBoundingBoxDescent',
    'actualBoundingBoxLeft', 'actualBoundingBoxRight', 'actualBoundingBoxAscent',
    'actualBoundingBoxDescent', 'hangingBaseline', 'ideographicBaseline'];
  const canvas = document.createElement('canvas').getContext('2d');
  const offscreen = new OffscreenCanvas(400, 150).getContext('2d');
  const rows = [];
  for (const family of families) for (const size of sizes) for (const sample of samples) {
    const font = `${size}px "${family}"`;
    const host = document.createElement('div');
    host.style.cssText = `position:absolute;left:-10000px;top:0;white-space:pre;font:${font};line-height:normal`;
    const span = document.createElement('span');
    span.textContent = sample;
    host.append(span);
    document.body.append(host);
    const rect = span.getBoundingClientRect();
    const range = document.createRange();
    range.selectNodeContents(span);
    const rangeRect = range.getBoundingClientRect();
    canvas.font = offscreen.font = font;
    const metrics = canvas.measureText(sample);
    const offscreenMetrics = offscreen.measureText(sample);
    const values = Object.fromEntries(fields.map(field => [field, metrics[field]]));
    const offscreenValues = Object.fromEntries(fields.map(field => [field, offscreenMetrics[field]]));
    rows.push({family, size, sample, metrics: values, offscreen: offscreenValues,
      inline: {width: rect.width, height: rect.height, y: rect.y},
      range: {width: rangeRect.width, height: rangeRect.height, y: rangeRect.y},
      offscreenMatches: fields.every(field => Object.is(metrics[field], offscreenMetrics[field]))});
    host.remove();
  }
  const result = {devicePixelRatio, rows, diagnosticOnly: true, corpusAdmission: false,
                  offscreenConsistencyPassed: rows.every(row => row.offscreenMatches)};
  return result;
})().then(reportFontResult, error => reportFontResult({
  diagnosticOnly: true, corpusAdmission: false, passed: false, error: String(error)
}));

async function reportFontResult(result) {
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
  const query = new URLSearchParams(location.search);
  if (query.get('report') === '1') {
    const response = await fetch('/result?' + new URLSearchParams({token: query.get('token') || ''}), {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)
    });
    if (!response.ok) throw new Error('Result POST failed: ' + response.status);
  }
  return result;
}
</script>
