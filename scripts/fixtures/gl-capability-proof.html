<!doctype html>
<meta charset="utf-8">
<title>GL capability proof control</title>
<pre id="out">Proving...</pre>
<script>
// Functional proof for advertised GL capabilities: presence is claimed by
// getExtension, reality is decided by completeness, errors and pixels.
// Small allocations only; no vendor/renderer strings collected.
(async () => {
  const result = {diagnosticOnly: true, corpusAdmission: false, cases: {}};
  const gl = document.createElement('canvas').getContext('webgl2');
  if (!gl) { result.noWebGL2 = true; }
  else {
    const err = () => { const e = gl.getError(); return e === gl.NO_ERROR ? 'NO_ERROR' : '0x' + e.toString(16); };
    // R16 renderable (EXT_texture_norm16).
    try {
      const ext = gl.getExtension('EXT_texture_norm16');
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texStorage2D(gl.TEXTURE_2D, 1, ext ? ext.R16_EXT : 0x81D0, 4, 4);
      const fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
      result.cases.r16 = {ext: !!ext, complete: status === gl.FRAMEBUFFER_COMPLETE,
        status: '0x' + status.toString(16), error: err()};
      gl.deleteFramebuffer(fb); gl.deleteTexture(tex);
    } catch (e) { result.cases.r16 = {threw: String(e)}; }
    // R16_SNORM renderbuffer (EXT_render_snorm).
    try {
      const ext = gl.getExtension('EXT_render_snorm');
      const rb = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
      let threw = null;
      try { gl.renderbufferStorage(gl.RENDERBUFFER, ext ? ext.R16_SNORM_EXT : 0x8F9B, 4, 4); }
      catch (e) { threw = String(e); }
      const fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rb);
      const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
      result.cases.r16snorm = {ext: !!ext, threw, complete: status === gl.FRAMEBUFFER_COMPLETE,
        status: '0x' + status.toString(16), error: err()};
      gl.deleteFramebuffer(fb); gl.deleteRenderbuffer(rb);
    } catch (e) { result.cases.r16snorm = {threw: String(e)}; }
    // 16x MSAA renderbuffer.
    try {
      const rb = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
      let threw = null;
      try { gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 16, gl.RGBA8, 4, 4); }
      catch (e) { threw = String(e); }
      const fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rb);
      const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
      result.cases.msaa16 = {threw, complete: status === gl.FRAMEBUFFER_COMPLETE,
        status: '0x' + status.toString(16), error: err(),
        maxSamples: gl.getParameter(gl.MAX_SAMPLES)};
      gl.deleteFramebuffer(fb); gl.deleteRenderbuffer(rb);
    } catch (e) { result.cases.msaa16 = {threw: String(e)}; }
    // Provoking vertex.
    try {
      const ext = gl.getExtension('WEBGL_provoking_vertex');
      let callError = null;
      if (ext) { try { ext.provokingVertexANGLE(ext.FIRST_VERTEX_CONVENTION_WEBGL); } catch (e) { callError = String(e); } }
      result.cases.provoking = {ext: !!ext, callError, error: err()};
    } catch (e) { result.cases.provoking = {threw: String(e)}; }
    // Dual-source blending presence and acceptance.
    try {
      const ext = gl.getExtension('WEBGL_blend_func_extended');
      let acceptError = null;
      if (ext) {
        gl.enable(gl.BLEND);
        try { gl.blendFuncSeparate(ext.SRC1_ALPHA_WEBGL, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE); }
        catch (e) { acceptError = String(e); }
        acceptError = acceptError || err();
        gl.disable(gl.BLEND);
      }
      result.cases.dualblend = {ext: !!ext, acceptError, error: err(),
        maxDualSource: gl.getParameter(0x88FD)};
    } catch (e) { result.cases.dualblend = {threw: String(e)}; }
  }
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
  const query = new URLSearchParams(location.search);
  if (query.get('report') === '1') {
    const response = await fetch('/result?' + new URLSearchParams({token: query.get('token') || ''}), {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)
    });
    if (!response.ok) throw new Error('Result POST failed: ' + response.status);
  }
})();
</script>
