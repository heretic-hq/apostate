<!doctype html><meta charset="utf-8"><title>Indexed draw boundary control</title>
<pre id="out">Checking small indexed draws...</pre><script>
(async () => {
  const result = {diagnosticOnly: true, corpusAdmission: false, rows: [], passed: false};
  try {
    const canvas = document.createElement('canvas'); canvas.width = canvas.height = 7;
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error('WebGL2 unavailable');
    const info = gl.getExtension('WEBGL_debug_renderer_info');
    result.renderer = info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    result.limit = gl.getParameter(gl.MAX_ELEMENT_INDEX);
    const query = new URLSearchParams(location.search);
    const auth = new URLSearchParams({token: query.get('token') || ''});
    const parameters = await (await fetch('/parameters?' + auth)).json();
    result.expectedLimit = parameters.expected_limits?.MAX_ELEMENT_INDEX ?? result.limit;
    function shader(type, source) {
      const object = gl.createShader(type); gl.shaderSource(object, source); gl.compileShader(object);
      if (!gl.getShaderParameter(object, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(object));
      return object;
    }
    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, '#version 300 es\nlayout(location=0) in vec4 p;flat out uint v;void main(){gl_Position=p;gl_PointSize=1.;v=uint(gl_VertexID);}'));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, '#version 300 es\nprecision highp float;precision highp int;flat in uint v;uniform uint expected;out vec4 c;void main(){c=v==expected?vec4(0,1,0,1):vec4(1,0,0,1);}'));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    const expected = gl.getUniformLocation(program, 'expected');
    const indices = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indices);
    const vertices = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vertices);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 0, 1]), gl.STATIC_DRAW);
    gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0);
    for (const mode of ['constant', 'instanced', 'bounded-attribute']) {
      if (mode === 'constant') { gl.disableVertexAttribArray(0); gl.vertexAttrib4f(0, 0, 0, 0, 1); }
      else { gl.enableVertexAttribArray(0); gl.vertexAttribDivisor(0, mode === 'instanced' ? 1 : 0); }
      for (const index of [0, 1, 0xffffff, 0x3ffffffe, 0x3fffffff, 0x40000000,
                           0x7fffffff, 0x80000000, 0xfffffffc, 0xfffffffd, 0xfffffffe, 0xffffffff]) {
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array([index]), gl.STATIC_DRAW);
        gl.uniform1ui(expected, index); gl.clearColor(0, 0, 1, 1); gl.clear(gl.COLOR_BUFFER_BIT);
        if (gl.getError()) throw new Error('setup error');
        if (mode === 'instanced') gl.drawElementsInstanced(gl.POINTS, 1, gl.UNSIGNED_INT, 0, 1);
        else gl.drawElements(gl.POINTS, 1, gl.UNSIGNED_INT, 0);
        const error = gl.getError(); const pixel = new Uint8Array(4);
        gl.readPixels(3, 3, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
        const restart = index === 0xffffffff;
        // The pinned ANGLE validator rejects equality with its reported bound.
        const rejected = !restart && (index >= result.limit || (mode === 'bounded-attribute' && index > 0));
        const wanted = restart || rejected ? [0, 0, 255, 255] : [0, 255, 0, 255];
        result.rows.push({mode, index, error, pixel: [...pixel], expectedError: rejected ? gl.INVALID_OPERATION : gl.NO_ERROR,
          passed: error === (rejected ? gl.INVALID_OPERATION : gl.NO_ERROR) && pixel.every((v, i) => v === wanted[i]) && gl.getError() === gl.NO_ERROR});
      }
    }
    result.passed = result.limit === result.expectedLimit && result.rows.every(row => row.passed);
    gl.deleteBuffer(indices); gl.deleteBuffer(vertices); gl.deleteProgram(program);
  } catch (error) { result.error = String(error); }
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
  const query = new URLSearchParams(location.search);
  const response = await fetch('/result?' + new URLSearchParams({token: query.get('token') || ''}),
    {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)});
  if (!response.ok) throw new Error('Result upload failed');
})();
</script>
