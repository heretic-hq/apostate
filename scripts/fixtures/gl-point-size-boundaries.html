<!doctype html>
<meta charset="utf-8">
<title>Native point-size pixel boundaries</title>
<pre id="result">Running...</pre>
<script>
const query = new URLSearchParams(location.search);
const tokenQuery = new URLSearchParams({token: query.get('token') || ''});

function redSpan(pixels) {
  const indices = [];
  for (let pixel = 0; pixel < pixels.length / 4; pixel++) {
    const offset = pixel * 4;
    if (pixels[offset] >= 250 && pixels[offset + 1] <= 5 && pixels[offset + 2] <= 5) indices.push(pixel);
  }
  return {first: indices[0] ?? null, last: indices.at(-1) ?? null, count: indices.length,
          contiguous: indices.length > 0 && indices.at(-1) - indices[0] + 1 === indices.length};
}

function pointProgram(gl, version) {
  const prefix = version === 2 ? '#version 300 es\n' : '';
  const sources = [prefix + `uniform highp float requestedSize;
void main() { gl_Position=vec4(0.0,0.0,0.0,1.0); gl_PointSize=requestedSize; }`,
    prefix + (version === 2 ? 'precision mediump float; out vec4 color;\nvoid main(){color=vec4(1.,0.,0.,1.);}'
      : 'precision mediump float;\nvoid main(){gl_FragColor=vec4(1.,0.,0.,1.);}')];
  const program = gl.createProgram();
  if (!program) throw new Error('createProgram returned null');
  const logs = [];
  for (let i = 0; i < sources.length; i++) {
    const shader = gl.createShader(i === 0 ? gl.VERTEX_SHADER : gl.FRAGMENT_SHADER);
    if (!shader) throw new Error('createShader returned null');
    gl.shaderSource(shader, sources[i]);
    gl.compileShader(shader);
    logs.push({compiled: gl.getShaderParameter(shader, gl.COMPILE_STATUS), log: gl.getShaderInfoLog(shader)});
    gl.attachShader(program, shader);
    gl.deleteShader(shader);
  }
  gl.linkProgram(program);
  const linkLog = gl.getProgramInfoLog(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    gl.deleteProgram(program);
    throw new Error(JSON.stringify({stage: 'shader/link', logs, linkLog}));
  }
  return {program, logs, linkLog};
}

function checkPoints(kind, expected) {
  const canvas = document.createElement('canvas');
  const gl = canvas.getContext(kind, {antialias: false, alpha: false, preserveDrawingBuffer: true});
  if (!gl) return {kind, passed: false, error: 'context unavailable'};
  const range = Array.from(gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE));
  const result = {kind, reported: range, expected, cases: [], diagnosticOnly: true};
  result.expectedRangeMatches = !expected || range.every((v, i) => v === expected[i]);
  result.nativeCapabilityBelowClaim = !!expected && (range[0] > expected[0] || range[1] < expected[1]);
  // Avoid large allocations or stressing a native driver with a huge point.
  // The two captured devices require only511 and1024; wider native ranges are
  // reported as untested rather than artificially clamped by the page.
  if (!range.every(Number.isInteger) || range[0] < 1 || range[1] > 1024 || range[0] > range[1]) {
    return {...result, passed: false, error: 'pixel test requires an integral native range within1..1024'};
  }
  const side = range[1] + 64;
  const viewport = Array.from(gl.getParameter(gl.MAX_VIEWPORT_DIMS));
  if (viewport.some(limit => limit < side)) {
    return {...result, passed: false, error: 'insufficient viewport margin to distinguish unclamped points'};
  }
  canvas.width = canvas.height = side;
  gl.viewport(0, 0, side, side);
  gl.disable(gl.BLEND);
  gl.disable(gl.DITHER);
  gl.disable(gl.DEPTH_TEST);
  gl.clearColor(0, 0, 0, 1);
  result.drawingBuffer = [gl.drawingBufferWidth, gl.drawingBufferHeight];
  if (result.drawingBuffer.some(value => value !== side)) {
    return {...result, passed: false, error: 'drawing buffer did not match requested test extent'};
  }
  const rowPixels = new Uint8Array(side * 4);
  const columnPixels = new Uint8Array(side * 4);
  // The second program repeats source verbatim to exercise a warm shader cache.
  for (let pass = 0; pass < 2; pass++) {
    const built = pointProgram(gl, kind === 'webgl2' ? 2 : 1);
    try {
      gl.useProgram(built.program);
      const location = gl.getUniformLocation(built.program, 'requestedSize');
      if (location === null) throw new Error('requestedSize uniform optimized away');
      const requests = pass === 0
        ? [...new Set([0.5, range[0], Math.max(range[0], range[1] - 1), range[1], range[1] + 1, range[1] + 33])]
        : [range[1] + 33];
      for (const requested of requests) {
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.uniform1f(location, requested);
        gl.drawArrays(gl.POINTS, 0, 1);
        gl.readPixels(0, Math.floor(side / 2), side, 1, gl.RGBA, gl.UNSIGNED_BYTE, rowPixels);
        gl.readPixels(Math.floor(side / 2), 0, 1, side, gl.RGBA, gl.UNSIGNED_BYTE, columnPixels);
        const horizontal = redSpan(rowPixels);
        const vertical = redSpan(columnPixels);
        const error = gl.getError();
        const expectedPixels = Math.round(Math.min(range[1], Math.max(range[0], requested)));
        result.cases.push({pass, requested, expectedPixels, horizontal, vertical, error,
          passed: error === gl.NO_ERROR && horizontal.contiguous && vertical.contiguous &&
                  horizontal.count === expectedPixels && vertical.count === expectedPixels});
      }
      result.shaderLogs = built.logs;
      result.linkLog = built.linkLog;
    } finally { gl.deleteProgram(built.program); }
  }
  result.passed = result.expectedRangeMatches && !gl.isContextLost() && result.cases.every(item => item.passed);
  return result;
}

window.pointBoundaryResultPromise = (async () => {
  const result = {diagnosticOnly: true, corpusAdmission: false, contexts: [], passed: false};
  try {
    const response = await fetch('/parameters?' + tokenQuery);
    if (!response.ok) throw new Error('parameters unavailable');
    const parameters = await response.json();
    const limits = parameters.expected_limits || {};
    const expected = parameters.expected_point_range ||
      (limits.ALIASED_POINT_SIZE_RANGE_MIN !== undefined || limits.ALIASED_POINT_SIZE_RANGE_MAX !== undefined
        ? [limits.ALIASED_POINT_SIZE_RANGE_MIN, limits.ALIASED_POINT_SIZE_RANGE_MAX] : null);
    if (expected && (!Array.isArray(expected) || expected.length !== 2 ||
        !expected.every(v => typeof v === 'number' && Number.isFinite(v) && v > 0) || expected[0] > expected[1])) {
      throw new Error('expected point range must be a positive ordered pair');
    }
    for (const kind of ['webgl', 'webgl2']) {
      try { result.contexts.push(checkPoints(kind, expected)); }
      catch (error) { result.contexts.push({kind, passed: false, error: String(error)}); }
    }
    result.passed = result.contexts.every(context => context.passed);
  } catch (error) { result.error = String(error); }
  document.querySelector('#result').textContent = JSON.stringify(result, null, 2);
  if (query.get('report') === '1') {
    const response = await fetch('/result?' + tokenQuery, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)
    });
    if (!response.ok) throw new Error('result POST failed: ' + response.status);
  }
  return result;
})();
</script>
