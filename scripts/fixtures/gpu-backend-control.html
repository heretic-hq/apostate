<!doctype html>
<meta charset="utf-8">
<title>Native GPU backend control</title>
<pre id="out">Collecting native GPU capabilities...</pre>
<script>
const bounded = (promise, label, ms = 12000) => Promise.race([
  promise, new Promise((_, reject) => setTimeout(() => reject(new Error(label + ' timeout')), ms))
]);
const errorText = error => String(error && (error.stack || error));
const plain = value => ArrayBuffer.isView(value) ? Array.from(value) : value;

function numericShader(gl, version, qualifier) {
  const shaders = [];
  let program, buffer, texture, framebuffer;
  try {
    const vertex = version === 2
      ? '#version 300 es\nin vec2 position; void main(){gl_Position=vec4(position,0,1);}'
      : 'attribute vec2 position; void main(){gl_Position=vec4(position,0,1);}';
    const fragment = `${version === 2 ? '#version 300 es\n' : ''}
precision ${qualifier} float;
uniform highp float inputA; uniform highp float inputB;
uniform bool floatTarget;
${version === 2 ? 'out highp vec4 color;' : ''}
void main() {
  ${qualifier} float a=inputA;
  ${qualifier} float b=inputB;
  ${qualifier} float sum=a+b;
  ${qualifier} float delta=sum-a;
  ${version === 2 ? 'color' : 'gl_FragColor'} = floatTarget
    ? vec4(delta, sum, a*b, sqrt(b)) : vec4(delta/b, step(a,sum), 0.0, 1.0);
}`;
    const compile = (type, source) => {
      const shader = gl.createShader(type); shaders.push(shader);
      gl.shaderSource(shader, source); gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
      return shader;
    };
    program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, 'position');
    gl.enableVertexAttribArray(position); gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
    let floatTarget = false;
    if (version === 2 && gl.getExtension('EXT_color_buffer_float')) {
      texture = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 1, 1, 0, gl.RGBA, gl.FLOAT, null);
      framebuffer = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
      floatTarget = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
      if (!floatTarget) gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }
    gl.viewport(0,0,1,1);
    gl.disable(gl.DITHER);
    gl.uniform1i(gl.getUniformLocation(program, 'floatTarget'), floatTarget ? 1 : 0);
    const cases = [[1,1/512],[1,1/2048],[1,1/8192],[64,1/256]].map(([a,b]) => {
      gl.uniform1f(gl.getUniformLocation(program, 'inputA'),a);
      gl.uniform1f(gl.getUniformLocation(program, 'inputB'),b);
      gl.drawArrays(gl.TRIANGLES,0,3);
      const values = floatTarget ? new Float32Array(4) : new Uint8Array(4);
      gl.readPixels(0,0,1,1,gl.RGBA,floatTarget ? gl.FLOAT : gl.UNSIGNED_BYTE,values);
      const error=gl.getError();
      const contextLost=gl.isContextLost();
      const validReadback=!contextLost && error===gl.NO_ERROR && Array.from(values).every(Number.isFinite) &&
        (floatTarget ? values[1]>0 && values[3]>0 : values[3]===255);
      return {a,b,values:Array.from(values),error,contextLost,validReadback};
    });
    return {qualifier,floatTarget,channels:floatTarget ? ['delta','sum','product','sqrtB'] : ['clampedDeltaOverB','sumAtLeastA','zero','one'],cases};
  } catch(error) { return {qualifier,error:errorText(error)}; }
  finally {
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    if (framebuffer) gl.deleteFramebuffer(framebuffer);
    if (texture) gl.deleteTexture(texture);
    if (buffer) gl.deleteBuffer(buffer);
    if (program) gl.deleteProgram(program);
    shaders.forEach(shader=>gl.deleteShader(shader));
  }
}

function webgl(version) {
  const canvas = document.createElement('canvas'); canvas.width=1; canvas.height=1;
  const gl = canvas.getContext(version===2 ? 'webgl2' : 'webgl',{antialias:false});
  if (!gl) return {available:false};
  const result={available:true,attributes:gl.getContextAttributes(),extensions:gl.getSupportedExtensions().sort()};
  const debug=gl.getExtension('WEBGL_debug_renderer_info');
  result.vendor=gl.getParameter(gl.VENDOR); result.renderer=gl.getParameter(gl.RENDERER);
  result.unmaskedVendor=debug ? gl.getParameter(debug.UNMASKED_VENDOR_WEBGL) : null;
  result.unmaskedRenderer=debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : null;
  result.version=gl.getParameter(gl.VERSION); result.shadingLanguageVersion=gl.getParameter(gl.SHADING_LANGUAGE_VERSION);
  result.limits={};
  for(const name of ['MAX_TEXTURE_SIZE','MAX_CUBE_MAP_TEXTURE_SIZE','MAX_RENDERBUFFER_SIZE','MAX_VIEWPORT_DIMS',
    'ALIASED_POINT_SIZE_RANGE','ALIASED_LINE_WIDTH_RANGE','MAX_VERTEX_ATTRIBS','MAX_VERTEX_UNIFORM_VECTORS',
    'MAX_FRAGMENT_UNIFORM_VECTORS','MAX_VARYING_VECTORS','MAX_TEXTURE_IMAGE_UNITS','MAX_VERTEX_TEXTURE_IMAGE_UNITS',
    'MAX_COMBINED_TEXTURE_IMAGE_UNITS','MAX_3D_TEXTURE_SIZE','MAX_ARRAY_TEXTURE_LAYERS','MAX_SAMPLES',
    'MAX_ELEMENT_INDEX','MAX_UNIFORM_BLOCK_SIZE','MAX_VERTEX_UNIFORM_COMPONENTS','MAX_FRAGMENT_UNIFORM_COMPONENTS']) {
    if (gl[name]!==undefined) result.limits[name]=plain(gl.getParameter(gl[name]));
  }
  result.precisions={};
  for(const stage of ['VERTEX_SHADER','FRAGMENT_SHADER']) {
    result.precisions[stage]={};
    for(const type of ['LOW_FLOAT','MEDIUM_FLOAT','HIGH_FLOAT','LOW_INT','MEDIUM_INT','HIGH_INT']) {
      const p=gl.getShaderPrecisionFormat(gl[stage],gl[type]);
      result.precisions[stage][type]=p ? {rangeMin:p.rangeMin,rangeMax:p.rangeMax,precision:p.precision} : null;
    }
  }
  result.numeric=['lowp','mediump','highp'].map(q=>numericShader(gl,version,q));
  result.finalError=gl.getError();
  result.contextLost=gl.isContextLost();
  gl.getExtension('WEBGL_lose_context')?.loseContext();
  return result;
}

async function webgpu() {
  if(!navigator.gpu) return {available:false};
  const result={available:true}; let device;
  try {
    const adapter=await bounded(navigator.gpu.requestAdapter({powerPreference:'high-performance'}),'requestAdapter');
    if(!adapter) return {...result,adapter:null};
    const info=adapter.info;
    result.adapter={info:Object.fromEntries(['vendor','architecture','device','description','subgroupMinSize','subgroupMaxSize'].map(k=>[k,info[k]??null])),
      isFallbackAdapter:adapter.isFallbackAdapter??null,features:Array.from(adapter.features).sort(),limits:{}};
    for(const key in adapter.limits) if(typeof adapter.limits[key]==='number') result.adapter.limits[key]=adapter.limits[key];
    device=await bounded(adapter.requestDevice(),'requestDevice');
    device.pushErrorScope('validation');
    const module=device.createShaderModule({code:'@group(0) @binding(0) var<storage,read_write> output:array<u32>; @compute @workgroup_size(4) fn main(@builtin(global_invocation_id) id:vec3<u32>) { output[id.x]=id.x*id.x+7u; }'});
    const pipeline=await bounded(device.createComputePipelineAsync({layout:'auto',compute:{module,entryPoint:'main'}}),'computePipeline');
    const storage=device.createBuffer({size:16,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC});
    const readback=device.createBuffer({size:16,usage:GPUBufferUsage.MAP_READ|GPUBufferUsage.COPY_DST});
    const group=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:storage}}]});
    const encoder=device.createCommandEncoder(); const pass=encoder.beginComputePass();
    pass.setPipeline(pipeline); pass.setBindGroup(0,group); pass.dispatchWorkgroups(1); pass.end();
    encoder.copyBufferToBuffer(storage,0,readback,0,16); device.queue.submit([encoder.finish()]);
    await bounded(readback.mapAsync(GPUMapMode.READ),'readback');
    const values=Array.from(new Uint32Array(readback.getMappedRange().slice(0))); readback.unmap();
    const validation=await bounded(device.popErrorScope(),'validation');
    result.compute={values,expected:[7,8,11,16],matches:JSON.stringify(values)==='[7,8,11,16]',validationError:validation?.message??null};
    storage.destroy(); readback.destroy();
  }catch(error){result.error=errorText(error);}finally{device?.destroy();}
  return result;
}

async function codecs() {
  const video=document.createElement('video'); const result={};
  for(const codec of ['hvc1.1.6.L93.B0','hev1.1.6.L93.B0','hvc1.2.4.L153.B0','avc1.640028']) {
    const contentType=`video/mp4; codecs="${codec}"`; const row={canPlayType:video.canPlayType(contentType)};
    try {row.decodingInfo=await bounded(navigator.mediaCapabilities.decodingInfo({type:'file',video:{contentType,width:1920,height:1080,bitrate:5000000,framerate:30}}),'decodingInfo');}
    catch(error){row.decodingInfoError=errorText(error);}
    if(window.VideoDecoder) {
      try {const r=await bounded(VideoDecoder.isConfigSupported({codec,codedWidth:1920,codedHeight:1080,hardwareAcceleration:'prefer-hardware'}),'VideoDecoder');row.webCodecsSupported=r.supported;}
      catch(error){row.webCodecsError=errorText(error);}
    }
    result[codec]=row;
  }
  return result;
}

(async()=>{
  const result={diagnostic_only:true,profile_replay:false,userAgent:navigator.userAgent,secureContext:isSecureContext};
  // Query independent capabilities before GL work that could reset the device.
  try {result.webgpu=await webgpu();result.codecs=await codecs();result.webgl1=webgl(1);result.webgl2=webgl(2);}
  catch(error){result.error=errorText(error);}
  document.querySelector('#out').textContent=JSON.stringify(result,null,2);
  const query=new URLSearchParams(location.search);
  if(query.get('report')==='1') await fetch('/result?'+new URLSearchParams({token:query.get('token')||''}),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});
})();
</script>
