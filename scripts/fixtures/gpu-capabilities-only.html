<!doctype html>
<meta charset="utf-8">
<title>GPU adapter capability control</title>
<pre id="out">Querying adapters...</pre>
<script>
// No WebGL context, shader, GPU device or command buffer is created here.
// This separates adapter eligibility from rendering failures in other tests.
(async () => {
  const result = {diagnosticOnly: true, corpusAdmission: false,
    deviceCreated: false, gpuCommandsSubmitted: false, adapters: {}};
  const bounded = (promise, label) => Promise.race([promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(label + ' timeout')), 12000))]);
  try {
    result.hasGPU = !!navigator.gpu;
    if (navigator.gpu) {
      for (const powerPreference of ['low-power', 'high-performance']) {
        const adapter = await bounded(navigator.gpu.requestAdapter({powerPreference}), powerPreference);
        if (!adapter) { result.adapters[powerPreference] = null; continue; }
        const info = adapter.info;
        const limits = {};
        for (const name of Object.getOwnPropertyNames(Object.getPrototypeOf(adapter.limits))) {
          if (name !== 'constructor' && typeof adapter.limits[name] === 'number') {
            limits[name] = adapter.limits[name];
          }
        }
        result.adapters[powerPreference] = {
          info: {vendor: info.vendor, architecture: info.architecture,
            device: info.device, description: info.description,
            isFallbackAdapter: info.isFallbackAdapter},
          features: [...adapter.features].sort(), limits
        };
      }
    }
  } catch (error) { result.error = String(error); }
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
  const query = new URLSearchParams(location.search);
  if (query.get('report') === '1') {
    const response = await fetch('/result?' + new URLSearchParams({token: query.get('token') || ''}), {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)
    });
    if (!response.ok) throw new Error('Result POST failed: ' + response.status);
  }
})();
</script>
