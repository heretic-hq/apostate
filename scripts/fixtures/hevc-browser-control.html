<!doctype html>
<meta charset="utf-8">
<title>Native media decode controls</title>
<pre id="out">Running media decode controls…</pre>
<script>
(async () => {
  const token = new URLSearchParams(location.search).get('token');
  const result = {diagnosticOnly: true, corpusAdmission: false, cases: [], passed: false};
  const bounded = (promise, label) => Promise.race([promise,
    new Promise((_, reject) => setTimeout(() => reject(Error(label + ' timeout')), 15000))]);
  const require = (value, message) => { if (!value) throw Error(message); };
  const event = (target, name) => bounded(new Promise((resolve, reject) => {
    const finish = value => { target.removeEventListener(name, success); target.removeEventListener('error', fail); return value; };
    const success = () => resolve(finish(true));
    const fail = () => reject(finish(Error(name + ': media error ' + (target.error?.code ?? 'unknown'))));
    target.addEventListener(name, success, {once:true}); target.addEventListener('error', fail, {once:true});
  }), name);
  const bytes = asset => Uint8Array.from(atob(asset.base64), c => c.charCodeAt(0));
  const hash = async data => [...new Uint8Array(await crypto.subtle.digest('SHA-256', data))]
    .map(n => n.toString(16).padStart(2,'0')).join('');
  async function sample(video) {
    const canvas = new OffscreenCanvas(32, 24), ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, 32, 24);
    const pixels = ctx.getImageData(0,0,32,24).data;
    require(video.videoWidth > 0 && video.videoHeight > 0 &&
      pixels.some((v,i) => i % 4 === 3 && v > 0), 'No decoded video frame');
    return {width:video.videoWidth, height:video.videoHeight, hash:await hash(pixels),
      deliveredFrames:video.getVideoPlaybackQuality().totalVideoFrames};
  }
  async function playback(name, asset, mse=false) {
    const row={name, mse, passed:false}, video=document.createElement('video');
    video.muted=true; video.preload='auto'; document.body.append(video);
    let url;
    try {
      const ready=event(video,'loadeddata');
      if (mse) {
        const source=new MediaSource(); url=URL.createObjectURL(source); video.src=url;
        await event(source,'sourceopen');
        const buffer=source.addSourceBuffer('video/mp4; codecs="'+asset.codec+'"');
        const appended=event(buffer,'updateend'); buffer.appendBuffer(bytes(asset)); await appended;
        source.endOfStream();
      } else { url=URL.createObjectURL(new Blob([bytes(asset)],{type:'video/mp4'}));video.src=url; }
      await ready;
      const startTime=mse&&video.buffered.length?video.buffered.start(0)+1/30000:0;
      row.bufferStart=startTime;
      if(startTime>0){const begin=event(video,'seeked');video.currentTime=startTime;await begin;}
      const presented=bounded(new Promise(resolve=>video.requestVideoFrameCallback(resolve)),'first frame');
      await bounded(video.play(),'start playback');await presented;video.pause();
      if(video.currentTime!==startTime){const reset=event(video,'seeked');video.currentTime=startTime;await reset;}
      row.initial=await sample(video);
      const seekTime=Math.min(1,video.duration/2);
      require(Number.isFinite(seekTime)&&seekTime>0,'Invalid media duration');
      const firstSeek=event(video,'seeked');video.currentTime=seekTime;await firstSeek;
      row.seek=await sample(video);
      const rewind=event(video,'seeked');video.currentTime=startTime;await rewind;
      const repeatSeek=event(video,'seeked');video.currentTime=seekTime;await repeatSeek;
      row.seekRepeat=await sample(video);
      require(row.seek.hash===row.seekRepeat.hash,'Seek/reset pixels are unstable');
      row.passed=true;
    } catch(error) {
      row.error=String(error);
      row.videoState={width:video.videoWidth,height:video.videoHeight,currentTime:video.currentTime,
        duration:video.duration,readyState:video.readyState,networkState:video.networkState,
        error:video.error?.message,paused:video.paused,
        buffered:Array.from({length:video.buffered.length},(_,i)=>[video.buffered.start(i),video.buffered.end(i)]),
        quality:video.getVideoPlaybackQuality().toJSON?.()??{frames:video.getVideoPlaybackQuality().totalVideoFrames}};
    }
    finally { video.pause();video.removeAttribute('src');video.load();video.remove();if(url)URL.revokeObjectURL(url); }
    result.cases.push(row);
  }
  async function webcodecs(name,asset) {
    const row={name,passed:false}, frames=[], errors=[];
    const decoder=new VideoDecoder({output:frame=>frames.push(frame),error:error=>errors.push(String(error))});
    try {
      const config={codec:asset.codec,hardwareAcceleration:'no-preference'};
      row.softwareSupport=(await VideoDecoder.isConfigSupported({...config,hardwareAcceleration:'prefer-software'})).supported;
      const support=await VideoDecoder.isConfigSupported(config);require(support.supported,'WebCodecs unsupported');
      const hashes=[];
      for(let pass=0;pass<2;pass++) {
        decoder.configure(config);
        decoder.decode(new EncodedVideoChunk({type:'key',timestamp:0,data:bytes(asset)}));
        await bounded(decoder.flush(),'decode flush');
        require(frames.length===1 && errors.length===0,'Expected exactly one decoded frame');
        const frame=frames.pop();
        row.frame={format:frame.format,width:frame.displayWidth,height:frame.displayHeight};
        if(frame.format) {
          const storage=new Uint8Array(frame.allocationSize());
          row.frame.layout=await frame.copyTo(storage);hashes.push(await hash(storage));
        } else {
          const canvas=new OffscreenCanvas(frame.displayWidth,frame.displayHeight), ctx=canvas.getContext('2d');
          ctx.drawImage(frame,0,0);hashes.push(await hash(ctx.getImageData(0,0,canvas.width,canvas.height).data));
          row.frame.readback='canvas-rgba';
        }
        frame.close();decoder.reset();
      }
      row.hashes=hashes;require(hashes[0]===hashes[1],'Decoder reset changed pixels');
      decoder.configure(config);
      const beforeErrors=errors.length;
      let rejected=false;
      try {
        decoder.decode(new EncodedVideoChunk({type:'key',timestamp:0,
          data:new Uint8Array([0,0,0,1,0,0,0,0])}));
        await bounded(decoder.flush(),'malformed decode flush');
      } catch(error) {
        if(String(error).includes('timeout'))throw error;
        rejected=true;
      }
      row.malformed={rejected:rejected||errors.length>beforeErrors,outputFrames:frames.length};
      require(row.malformed.rejected&&frames.length===0,'Malformed input was not rejected');
      row.passed=true;
    }catch(error){row.error=String(error);}
    finally{for(const frame of frames)frame.close();if(decoder.state!=='closed')decoder.close();}
    result.cases.push(row);
  }
  try {
    const parameters=await (await fetch('/parameters?'+new URLSearchParams({token}))).json();
    result.expectHEVC=parameters.expectHEVC;
    result.assetHashes={};
    for(const [name,asset] of Object.entries(parameters.assets)) {
      require(await hash(bytes(asset))===asset.sha256,'Asset hash mismatch: '+name);
      result.assetHashes[name]=asset.sha256;
    }
    const video=document.createElement('video');result.support={};
    for(const name of ['main','main10','h264','fragmented']) {
      const mime='video/mp4; codecs="'+parameters.assets[name].codec+'"';
      result.support[name]={canPlayType:video.canPlayType(mime),mse:MediaSource.isTypeSupported(mime)};
      if(name!=='h264') require(!!result.support[name].canPlayType===parameters.expectHEVC,'Unexpected HEVC support: '+name);
    }
    await playback('h264-file',parameters.assets.h264);
    await webcodecs('h264-webcodecs',parameters.assets.h264Frame);
    if(parameters.expectHEVC) {
      await playback('main-file',parameters.assets.main);
      await playback('main10-file',parameters.assets.main10);
      await playback('main-mse',parameters.assets.fragmented,true);
      await webcodecs('main10-webcodecs',parameters.assets.main10Frame);
    }
    result.passed=result.cases.length===(parameters.expectHEVC?6:2)&&result.cases.every(row=>row.passed);
  }catch(error){result.error=String(error);}
  document.querySelector('#out').textContent=JSON.stringify(result,null,2);
  await fetch('/result?'+new URLSearchParams({token}),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});
})();
</script>
