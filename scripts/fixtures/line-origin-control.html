<!doctype html>
<meta charset="utf-8">
<title>Line origin control</title>
<pre id="out">Probing...</pre>
<script>
// Isolate the uniform +2px vertical shift: strut-only line, each span,
// body margin, scroll offsets, and range rects.
(async () => {
  const result = {diagnosticOnly: true, corpusAdmission: false};
  try {
    result.scroll = {x: window.scrollX, y: window.scrollY};
    result.bodyMargin = {top: getComputedStyle(document.body).marginTop,
      devicePixelRatio, innerHeight: window.innerHeight};
    const host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden';
    host.innerHTML =
      '<div id="strutonly">x</div>' +
      '<span style="font:24px monospace">Apostate mLj</span>' +
      '<span style="font:18px serif">W_i_d_t_h</span>' +
      '<span style="font:italic 700 15px \'Times New Roman\',serif">gQÅ字</span>' +
      '<div style="display:inline-block;width:3.7em;font:12px sans-serif">x</div>';
    document.body.appendChild(host);
    result.hostTop = host.getBoundingClientRect().top;
    const rows = [];
    host.querySelectorAll('#strutonly,span,div').forEach((el) => {
      const r = el.getBoundingClientRect();
      const cs = getComputedStyle(el);
      rows.push({tag: el.tagName, top: r.top, height: r.height,
        lineHeight: cs.lineHeight, font: cs.fontFamily + ' ' + cs.fontSize});
    });
    result.rows = rows;
    const range = document.createRange();
    range.selectNodeContents(host.querySelector('span'));
    const rr = range.getBoundingClientRect();
    result.rangeTop = rr.top;
    host.remove();
  } catch (error) { result.error = String(error); }
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
  const query = new URLSearchParams(location.search);
  if (query.get('report') === '1') {
    const response = await fetch('/result?' + new URLSearchParams({token: query.get('token') || ''}), {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)
    });
    if (!response.ok) throw new Error('Result POST failed: ' + response.status);
  }
})();
</script>
