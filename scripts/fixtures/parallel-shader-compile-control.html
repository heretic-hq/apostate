<!doctype html><meta charset="utf-8"><title>Native parallel shader compile control</title><pre id="out">Checking native completion queries...</pre>
<script>
// Diagnostic only. Synchronous completion is valid; no minimum latency or false
// status is required. Every linked program is checked by drawing and readback.
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function complete(gl,obj,shader,ext){const start=performance.now();let polls=0;for(;;){const value=shader?gl.getShaderParameter(obj,ext.COMPLETION_STATUS_KHR):gl.getProgramParameter(obj,ext.COMPLETION_STATUS_KHR);if(typeof value!=='boolean')throw new Error('Completion result is not boolean');polls++;if(value)return {polls,elapsedMs:performance.now()-start};if(performance.now()-start>5000)throw new Error('Completion did not finish within5seconds');await sleep(1);}}
function makeShader(gl,type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);return s;}
async function check(kind){
 const canvas=document.createElement('canvas');canvas.width=canvas.height=8;document.body.append(canvas);const gl=canvas.getContext(kind);if(!gl)return {context:kind,passed:false,error:'context unavailable'};
 const ext=gl.getExtension('KHR_parallel_shader_compile'),r={context:kind,extension:!!ext,rounds:[]};
 if(!ext){r.passed=false;r.error='native extension unavailable';canvas.remove();return r;}
 const vs=kind==='webgl2'?'#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0,1);}':'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}';
 const fs=kind==='webgl2'?'#version 300 es\nprecision mediump float;out vec4 c;void main(){c=vec4(1,0,0,1);}':'precision mediump float;void main(){gl_FragColor=vec4(1,0,0,1);}';
 try{
  // Identical second input can exercise a cache hit, but a hit is not assumed.
  for(let round=0;round<2;round++){
   const v=makeShader(gl,gl.VERTEX_SHADER,vs),f=makeShader(gl,gl.FRAGMENT_SHADER,fs),p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);
   const waits={vertex:await complete(gl,v,true,ext),fragment:await complete(gl,f,true,ext),program:await complete(gl,p,false,ext)};
   const statuses={vertex:gl.getShaderParameter(v,gl.COMPILE_STATUS),fragment:gl.getShaderParameter(f,gl.COMPILE_STATUS),link:gl.getProgramParameter(p,gl.LINK_STATUS)};
   gl.useProgram(p);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const pos=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(pos);gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,3);const pixel=new Uint8Array(4);gl.readPixels(4,4,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
   const error=gl.getError();r.rounds.push({waits,statuses,pixel:[...pixel],error});gl.deleteBuffer(b);gl.deleteProgram(p);gl.deleteShader(v);gl.deleteShader(f);
  }
  const invalid=makeShader(gl,gl.FRAGMENT_SHADER,'this is not a shader');r.invalidShader={completion:await complete(gl,invalid,true,ext),compiled:gl.getShaderParameter(invalid,gl.COMPILE_STATUS)};gl.deleteShader(invalid);
  // Start a link, then release caller references before polling. Implementations
  // must keep pending jobs safe; this control makes no timing assertion.
  const v=makeShader(gl,gl.VERTEX_SHADER,vs),f=makeShader(gl,gl.FRAGMENT_SHADER,fs),p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);gl.deleteShader(v);gl.deleteShader(f);r.deletedAttachedShaders={completion:await complete(gl,p,false,ext),linked:gl.getProgramParameter(p,gl.LINK_STATUS)};gl.deleteProgram(p);
  const lose=gl.getExtension('WEBGL_lose_context');r.contextLoss={supported:!!lose};
  if(lose){const s=makeShader(gl,gl.VERTEX_SHADER,vs),p=gl.createProgram();gl.attachShader(p,s);gl.linkProgram(p);const event=new Promise(resolve=>canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();resolve();},{once:true}));lose.loseContext();await Promise.race([event,sleep(3000).then(()=>{throw new Error('contextlost event timeout');})]);r.contextLoss.shaderCompletion=gl.getShaderParameter(s,ext.COMPLETION_STATUS_KHR);r.contextLoss.programCompletion=gl.getProgramParameter(p,ext.COMPLETION_STATUS_KHR);}
  r.passed=r.rounds.every(x=>x.statuses.vertex&&x.statuses.fragment&&x.statuses.link&&x.error===0&&x.pixel.join(',')==='255,0,0,255')&&!r.invalidShader.compiled&&r.deletedAttachedShaders.linked&&(!r.contextLoss.supported||(r.contextLoss.shaderCompletion===true&&r.contextLoss.programCompletion===true));
 }catch(e){r.error={name:e.name,message:e.message};r.passed=false;}
 canvas.remove();return r;
}
(async()=>{const results=[];for(const kind of ['webgl','webgl2'])results.push(await check(kind));const result={diagnosticOnly:true,corpusAdmission:false,passed:results.every(x=>x.passed),results};document.getElementById('out').textContent=JSON.stringify(result,null,2);const q=new URLSearchParams(location.search);if(q.get('report')==='1')await fetch('/result?'+new URLSearchParams({token:q.get('token')||''}),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});})();
</script>
