<!doctype html>
<meta charset="utf-8">
<title>Parity probe control</title>
<pre id="out">Probing...</pre>
<script>
// Minimal cross-browser parity probe: API presence and capability values only.
// No rendering, no audio, no network, no device commands.
(async () => {
  const result = {diagnosticOnly: true, corpusAdmission: false};
  try {
    const gl1 = document.createElement('canvas').getContext('webgl');
    const gl2 = document.createElement('canvas').getContext('webgl2');
    result.webgl1 = gl1 ? {
      extensions: gl1.getSupportedExtensions().sort(),
      maxTextureSize: gl1.getParameter(gl1.MAX_TEXTURE_SIZE)
    } : null;
    result.webgl2 = gl2 ? {
      extensions: gl2.getSupportedExtensions().sort(),
      maxTextureSize: gl2.getParameter(gl2.MAX_TEXTURE_SIZE),
      maxElementIndex: gl2.getParameter(gl2.MAX_ELEMENT_INDEX),
      maxSamples: gl2.getParameter(gl2.MAX_SAMPLES)
    } : null;
  } catch (error) { result.webglError = String(error); }
  try {
    result.share = 'share' in Navigator.prototype;
    result.canShare = 'canShare' in Navigator.prototype;
    result.barcodeDetector = 'BarcodeDetector' in window;
    result.hasGpu = 'gpu' in navigator;
    const v = document.createElement('video');
    result.hevc = {
      hev1: v.canPlayType('video/mp4; codecs="hev1.1.6.L93.B0"'),
      hvc1: v.canPlayType('video/mp4; codecs="hvc1.1.6.L93.B0"')
    };
    try {
      const info = await navigator.mediaCapabilities.decodingInfo({
        type: 'file',
        video: {contentType: 'video/mp4; codecs="hev1.1.6.L93.B0"',
          width: 1920, height: 1080, bitrate: 2000000, framerate: 30}
      });
      result.hevc.decodingSupported = info.supported;
      result.hevc.decodingPowerEfficient = info.powerEfficient;
    } catch (error) { result.hevc.decodingError = String(error); }
    result.speech = {
      hasSynthesis: 'speechSynthesis' in window,
      voices: ('speechSynthesis' in window) ? speechSynthesis.getVoices().length : null
    };
  } catch (error) { result.apiError = String(error); }
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
  const query = new URLSearchParams(location.search);
  if (query.get('report') === '1') {
    const response = await fetch('/result?' + new URLSearchParams({token: query.get('token') || ''}), {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)
    });
    if (!response.ok) throw new Error('Result POST failed: ' + response.status);
  }
})();
</script>
