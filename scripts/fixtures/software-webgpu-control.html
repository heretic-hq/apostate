<!doctype html>
<meta charset="utf-8">
<title>Software WebGPU provider control</title>
<pre id="out">Running native provider checks…</pre>
<script>
// Authored diagnostics only. This page never overrides browser APIs or replays
// reference pixels/caps. Negative controls stop after adapter discovery.
window.softwareWebGPUResultPromise = (async () => {
  const query = new URLSearchParams(location.search);
  const parametersResponse = await fetch('/parameters?' + new URLSearchParams({token: query.get('token') || ''}));
  const parameters = parametersResponse.ok ? await parametersResponse.json() : {};
  const expectAdapter = parameters.expectAdapter ?? true;
  const result = {diagnosticOnly: true, corpusAdmission: false, expectAdapter,
    checks: {}, gpuCommandsSubmitted: false, errors: []};
  const bounded = (promise, label) => Promise.race([promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(label + ' timeout')), 12000))]);
  const require = (condition, message) => { if (!condition) throw new Error(message); };
  const devices = [];
  try {
    result.hasGPU = !!navigator.gpu;
    require(result.hasGPU, 'WebGPU API is absent; this is not an adapter eligibility control');
    const adapter = await bounded(navigator.gpu.requestAdapter(), 'requestAdapter');
    result.adapterPresent = !!adapter;
    if (!expectAdapter) {
      require(adapter === null, 'Unexpected adapter in negative control');
      result.checks.noAdapterExpected = true;
      result.passed = true;
      return result;
    }
    require(adapter, 'No real adapter');
    require(adapter.features.has('core-features-and-limits'), 'Adapter is not Core');
    result.features = [...adapter.features].sort();
    result.info = Object.fromEntries(['vendor', 'architecture', 'device', 'description',
      'subgroupMinSize', 'subgroupMaxSize', 'isFallbackAdapter'].map(name => [name, adapter.info[name]]));
    result.limits = Object.fromEntries(Object.getOwnPropertyNames(Object.getPrototypeOf(adapter.limits))
      .filter(name => name !== 'constructor' && typeof adapter.limits[name] === 'number')
      .map(name => [name, adapter.limits[name]]));
    const device = await bounded(adapter.requestDevice(), 'requestDevice');
    devices.push(device);
    device.addEventListener('uncapturederror', event => result.errors.push(String(event.error)));
    device.lost.then(info => { if (info.reason !== 'destroyed') result.errors.push('Device lost: ' + info.message); });
    result.checks.coreDevice = device.features.has('core-features-and-limits');
    require(result.checks.coreDevice, 'Device is not Core');

    const storage = device.createBuffer({size: 64, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC});
    const readback = device.createBuffer({size: 64, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ});
    const module = device.createShaderModule({code: `
      @group(0) @binding(0) var<storage, read_write> output: array<u32>;
      @compute @workgroup_size(4) fn main(@builtin(global_invocation_id) id: vec3u) {
        if (id.x < 16u) { output[id.x] = id.x * 5u + 3u; }
      }`});
    const compute = device.createComputePipeline({layout: 'auto', compute: {module, entryPoint: 'main'}});
    const group = device.createBindGroup({layout: compute.getBindGroupLayout(0),
      entries: [{binding: 0, resource: {buffer: storage}}]});
    let encoder = device.createCommandEncoder();
    const computePass = encoder.beginComputePass();
    computePass.setPipeline(compute);
    computePass.setBindGroup(0, group);
    computePass.dispatchWorkgroups(4);
    computePass.end();
    encoder.copyBufferToBuffer(storage, 0, readback, 0, 64);
    device.queue.submit([encoder.finish()]);
    result.gpuCommandsSubmitted = true;
    await bounded(readback.mapAsync(GPUMapMode.READ), 'compute map');
    result.computeValues = [...new Uint32Array(readback.getMappedRange())];
    result.checks.compute = result.computeValues.length === 16 && result.computeValues.every((value, i) => value === i * 5 + 3);
    readback.unmap();
    require(result.checks.compute, 'Compute values differ');

    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 4;
    document.body.append(canvas);
    const context = canvas.getContext('webgpu');
    require(context, 'No GPU canvas context');
    const format = navigator.gpu.getPreferredCanvasFormat();
    result.canvasFormat = format;
    context.configure({device, format, alphaMode: 'opaque'});
    const renderModule = device.createShaderModule({code: `
      @vertex fn vertexMain(@builtin(vertex_index) index: u32) -> @builtin(position) vec4f {
        let positions = array<vec2f, 3>(vec2f(-1,-1), vec2f(3,-1), vec2f(-1,3));
        return vec4f(positions[index], 0, 1);
      }
      @fragment fn fragmentMain(@builtin(position) p: vec4f) -> @location(0) vec4f {
        if (p.y < 2) {
          if (p.x < 2) { return vec4f(1,0,0,1); }
          return vec4f(0,1,0,1);
        }
        if (p.x < 2) { return vec4f(0,0,1,1); }
        return vec4f(1,1,1,1);
      }`});
    const pipeline = device.createRenderPipeline({layout: 'auto',
      vertex: {module: renderModule, entryPoint: 'vertexMain'},
      fragment: {module: renderModule, entryPoint: 'fragmentMain', targets: [{format}]}});
    encoder = device.createCommandEncoder();
    const renderPass = encoder.beginRenderPass({colorAttachments: [{
      view: context.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store',
      clearValue: {r: 1, g: 0, b: 0, a: 1}}]});
    renderPass.setPipeline(pipeline);
    renderPass.draw(3);
    renderPass.end();
    device.queue.submit([encoder.finish()]);
    await bounded(device.queue.onSubmittedWorkDone(), 'render completion');
    const bitmap = await bounded(createImageBitmap(canvas), 'canvas shared-image snapshot');
    const destination = new OffscreenCanvas(4, 4).getContext('2d');
    destination.drawImage(bitmap, 0, 0);
    bitmap.close();
    result.renderPixels = [...destination.getImageData(0, 0, 4, 4).data];
    const expectedPixels = Array.from({length: 16}, (_, pixel) => {
      const x = pixel % 4, y = Math.floor(pixel / 4);
      return y < 2 ? (x < 2 ? [255,0,0,255] : [0,255,0,255]) :
        (x < 2 ? [0,0,255,255] : [255,255,255,255]);
    }).flat();
    result.checks.renderAndSharedImage = result.renderPixels.length === 64 &&
      result.renderPixels.every((value, i) => value === expectedPixels[i]);
    require(result.checks.renderAndSharedImage, 'Render/shared-image pixels differ');
    context.unconfigure();
    canvas.remove();

    device.pushErrorScope('validation');
    device.createShaderModule({code: '@compute fn invalid( {'});
    const shaderError = await bounded(device.popErrorScope(), 'shader validation');
    result.checks.invalidWGSLRejected = !!shaderError;
    require(result.checks.invalidWGSLRejected, 'Invalid WGSL was accepted');
    const negativeAdapter = await bounded(navigator.gpu.requestAdapter(), 'negative-case adapter');
    require(negativeAdapter, 'Missing negative-case adapter');
    try {
      const unexpected = await bounded(negativeAdapter.requestDevice({requiredLimits: {
        maxTextureDimension2D: negativeAdapter.limits.maxTextureDimension2D + 1}}), 'above-limit device');
      unexpected.destroy();
      result.checks.aboveLimitRejected = false;
    } catch (error) {
      if (String(error).includes('timeout')) throw error;
      result.checks.aboveLimitRejected = true;
      result.limitError = {name: error.name, message: error.message};
    }
    require(result.checks.aboveLimitRejected, 'Above-adapter limit was accepted');
    require(result.errors.length === 0, 'Unexpected errors were reported');
    result.passed = true;
  } catch (error) {
    result.passed = false;
    result.error = String(error);
  } finally {
    for (const device of devices) device.destroy();
  }
  return result;
})().then(async result => {
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
  const query = new URLSearchParams(location.search);
  if (query.get('report') === '1') {
    const response = await fetch('/result?' + new URLSearchParams({token: query.get('token') || ''}), {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)
    });
    if (!response.ok) throw new Error('Result POST failed: ' + response.status);
  }
  return result;
});
</script>
