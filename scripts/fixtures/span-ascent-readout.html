<!doctype html>
<meta charset="utf-8">
<title>Span ascent readout</title>
<pre id="out">Probing...</pre>
<script>
// For the exact V3 clientrects spans: canvas-measured ascent/descent with
// the same font string, plus box tops. Decides whether 0066 fired per span.
(async () => {
  const result = {diagnosticOnly: true, corpusAdmission: false, rows: []};
  try {
    const host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden';
    host.innerHTML =
      '<span style="font:24px monospace">Apostate mLj</span>' +
      '<span style="font:18px serif">W_i_d_t_h</span>' +
      '<span style="font:italic 700 15px \'Times New Roman\',serif">gQÅ字</span>';
    document.body.appendChild(host);
    const ctx = document.createElement('canvas').getContext('2d');
    host.querySelectorAll('span').forEach((el) => {
      const r = el.getBoundingClientRect();
      const cs = getComputedStyle(el);
      ctx.font = cs.font;
      const m = ctx.measureText('Apostate mLj');
      result.rows.push({font: cs.font, top: r.top, height: r.height,
        boxAscent: m.fontBoundingBoxAscent, boxDescent: m.fontBoundingBoxDescent,
        actualAscent: m.actualBoundingBoxAscent});
    });
    host.remove();
  } catch (error) { result.error = String(error); }
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
  const query = new URLSearchParams(location.search);
  if (query.get('report') === '1') {
    const response = await fetch('/result?' + new URLSearchParams({token: query.get('token') || ''}), {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)
    });
    if (!response.ok) throw new Error('Result POST failed: ' + response.status);
  }
})();
</script>
