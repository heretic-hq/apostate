<!doctype html>
<meta charset="utf-8">
<title>Vertical align decomposition</title>
<pre id="out">Probing...</pre>
<script>
// Decompose the +2px: explicit line-heights and vertical-align variants on
// the same span. Separates line-box height from in-line positioning.
(async () => {
  const result = {diagnosticOnly: true, corpusAdmission: false, rows: []};
  try {
    const host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden';
    document.body.appendChild(host);
    const cases = [
      'font:24px monospace',
      'font:24px monospace;line-height:24px',
      'font:24px monospace;line-height:28px',
      'font:24px monospace;line-height:32px',
      'font:24px monospace;vertical-align:top',
      'font:24px monospace;vertical-align:text-top',
      'font:24px monospace;line-height:24px;vertical-align:top'
    ];
    for (const style of cases) {
      host.innerHTML = '<span style="' + style + '">Apostate mLj</span>';
      const el = host.firstChild;
      const r = el.getBoundingClientRect();
      result.rows.push({style, top: r.top, height: r.height});
    }
    host.remove();
  } catch (error) { result.error = String(error); }
  document.querySelector('#out').textContent = JSON.stringify(result, null, 2);
  const query = new URLSearchParams(location.search);
  if (query.get('report') === '1') {
    const response = await fetch('/result?' + new URLSearchParams({token: query.get('token') || ''}), {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(result)
    });
    if (!response.ok) throw new Error('Result POST failed: ' + response.status);
  }
})();
</script>
