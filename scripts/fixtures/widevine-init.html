<!doctype html>
<meta charset="utf-8">
<title>Widevine initialization check</title>
<p>This local check initializes the CDM and requests a license message. It does
not contact a license server, submit a license, or establish encrypted playback.</p>
<video id="media" hidden></video>
<pre id="result">Running...</pre>
<script>
// Serve on localhost or HTTPS with a fresh, explicitly provisioned profile.
// Widevine v0 PSSH follows Google's public Shaka Packager generator at:
// https://github.com/shaka-project/shaka-packager/blob/74ca0784a1b3f9a4e5e47869ad3833fbf0e31b62/packager/media/base/widevine_pssh_generator.cc
// Its proto carries key_id field2 and protection_scheme field9. No content key,
// provider credentials or protected media are included. The public test KID is
// 00112233445566778899aabbccddeeff; scheme is the integer FourCC "cenc".
// A valid Common-SystemID v1 box was rejected by the installed Widevine CDM;
// that compatibility result remains in the earlier diagnostic receipt.
const pssh = new Uint8Array([
  0x00, 0x00, 0x00, 0x38, 0x70, 0x73, 0x73, 0x68,
  0x00, 0x00, 0x00, 0x00, 0xed, 0xef, 0x8b, 0xa9,
  0x79, 0xd6, 0x4a, 0xce, 0xa3, 0xc8, 0x27, 0xdc,
  0xd5, 0x1d, 0x21, 0xed, 0x00, 0x00, 0x00, 0x18,
  0x12, 0x10, 0x00, 0x11, 0x22, 0x33, 0x44, 0x55,
  0x66, 0x77, 0x88, 0x99, 0xaa, 0xbb, 0xcc, 0xdd,
  0xee, 0xff, 0x48, 0xe3, 0xdc, 0x95, 0x9b, 0x06
]);

window.widevineResultPromise = (async () => {
  const result = {
    stage: "requestMediaKeySystemAccess", passed: false,
    initDataFormat: "widevine-v0-cenc", initDataBytes: pssh.byteLength,
    encryptedPlaybackTested: false, licenseServerContacted: false
  };
  let session;
  let timer;
  try {
    const access = await navigator.requestMediaKeySystemAccess("com.widevine.alpha", [{
      initDataTypes: ["cenc"],
      audioCapabilities: [{contentType: 'audio/mp4; codecs="mp4a.40.2"'}],
      distinctiveIdentifier: "not-allowed", persistentState: "not-allowed",
      sessionTypes: ["temporary"]
    }]);
    result.keySystem = access.keySystem;
    result.stage = "createMediaKeys";
    const keys = await access.createMediaKeys();
    result.stage = "setMediaKeys";
    await document.querySelector("video").setMediaKeys(keys);
    result.stage = "generateRequest";
    session = keys.createSession("temporary");
    const message = new Promise((resolve, reject) => {
      session.addEventListener("message", event => resolve({
        type: event.messageType, bytes: event.message.byteLength
      }), {once: true});
      timer = setTimeout(() => reject(new Error("No CDM message within 10 seconds")), 10000);
    });
    const [, licenseMessage] = await Promise.all([
      session.generateRequest("cenc", pssh), message
    ]);
    result.stage = "license-message";
    result.message = licenseMessage;
    if (result.message.type !== "license-request" || result.message.bytes === 0) {
      throw new Error("CDM did not emit a nonempty license-request message");
    }
    result.passed = true;
  } catch (error) {
    result.error = {name: error.name, message: error.message};
  } finally {
    clearTimeout(timer);
    if (session) {
      try { await session.close(); } catch (_) {}
    }
  }
  result.diagnosticOnly = true;
  result.corpusAdmission = false;
  document.querySelector("pre").textContent = JSON.stringify(result, null, 2);
  document.documentElement.dataset.complete = "true";
  const query = new URLSearchParams(location.search);
  if (query.get("report") === "1") {
    const response = await fetch("/result?" + new URLSearchParams({token: query.get("token") || ""}), {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(result)
    });
    if (!response.ok) throw new Error("Result POST failed: " + response.status);
  }
  return result;
})();
</script>
