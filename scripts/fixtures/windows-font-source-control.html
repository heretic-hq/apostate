<!doctype html>
<meta charset="utf-8">
<title>Windows font source control</title>
<pre id="out">Measuring font sources...</pre>
<script>
(async()=>{
  const rows=[],c=document.createElement('canvas'),g=c.getContext('2d');
  const families=['Arial','Consolas','Calibri','Palatino Linotype','Times New Roman','Malgun Gothic','Microsoft YaHei','SimSun','Microsoft JhengHei','Noto Sans','Roboto','system-ui','serif','sans-serif','monospace'];
  const properties=['width','actualBoundingBoxLeft','actualBoundingBoxRight','actualBoundingBoxAscent','actualBoundingBoxDescent','fontBoundingBoxAscent','fontBoundingBoxDescent','hangingBaseline','ideographicBaseline'];
  for(const family of families)for(const size of [24,40])for(const sample of ['HxpgÅ','字','HxpgÅ字']){
    const name=['system-ui','serif','sans-serif','monospace'].includes(family)?family:JSON.stringify(family);
    g.font=`${size}px ${name}`;
    const metrics=g.measureText(sample),values={};for(const key of properties)values[key]=metrics[key];
    const div=document.createElement('div');div.style.cssText=`position:absolute;left:-10000px;top:0;white-space:pre;font:${size}px ${name};line-height:normal;`;
    const first=document.createElement('span'),second=document.createElement('span');first.textContent=sample;second.textContent=sample;div.append(first,document.createElement('br'),second);document.body.append(div);
    const a=first.getBoundingClientRect(),b=second.getBoundingClientRect();
    rows.push({family,size,sample,font:g.font,metrics:values,inline:{width:a.width,height:a.height,firstTop:a.top,secondTop:b.top,lineAdvance:b.top-a.top}});div.remove();
  }
  const result={diagnostic_only:true,corpus_admission:false,userAgent:navigator.userAgent,language:navigator.language,rows};
  document.querySelector('#out').textContent=JSON.stringify(result,null,2);
  const query=new URLSearchParams(location.search);
  if(query.get('report')==='1')await fetch('/result?'+new URLSearchParams({token:query.get('token')||''}),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});
})();
</script>
