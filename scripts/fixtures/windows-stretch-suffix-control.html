<!doctype html>
<meta charset="utf-8">
<title>Windows family suffix control</title>
<pre id="out">Waiting for control parameters...</pre>
<script>
// Parameters: {"font_set":"missing"} for windows-fallback-20260910,
// or {"font_set":"real"} for windows-candidate-20260910.
// Upstream Windows font_cache_skia_win.cc:427-481 retries only unavailable
// family names; exact Narrow faces win, and src:local() never strips suffixes.
// These sets contain regular/bold/italic Arial, plus four separate Narrow
// faces only in the real set. Neither set has a full face named Arial Condensed.
(async()=>{
  const query=new URLSearchParams(location.search),auth=new URLSearchParams({token:query.get('token')||''});
  const result={diagnostic_only:true,corpus_admission:false,rows:[],localFaces:[],failures:[]};
  const checks=(condition,message)=>{if(!condition)result.failures.push(message);};
  const bounded=(promise,label)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timeout')),5000))]);
  const styles=[
    {id:'regular',style:'normal',weight:400,postscript:'ArialNarrow'},
    {id:'bold',style:'normal',weight:700,postscript:'ArialNarrow-Bold'},
    {id:'italic',style:'italic',weight:400,postscript:'ArialNarrow-Italic'},
    {id:'bold-italic',style:'italic',weight:700,postscript:'ArialNarrow-BoldItalic'}
  ];
  try{
    const params=await (await fetch('/parameters?'+auth)).json();
    if(!['missing','real'].includes(params.font_set))throw new Error('font_set must be missing or real');
    result.fontSet=params.font_set;result.userAgent=navigator.userAgent;
    const real=params.font_set==='real';
    const canvas=document.createElement('canvas'),g=canvas.getContext('2d');
    if(!('fontStretch' in g))throw new Error('native Canvas fontStretch unavailable');
    async function loadLocal(id,source,style='normal',weight=400,add=false){
      const face=new FontFace('SuffixControl_'+id,`local(${JSON.stringify(source)})`,{style,weight:String(weight)});
      const record={id,source,style,weight,loaded:false};
      try{await bounded(face.load(),source);record.loaded=face.status==='loaded';if(add)document.fonts.add(face);}
      catch(error){record.error=String(error);}
      result.localFaces.push(record);return record.loaded?face.family:null;
    }
    for(const style of styles){
      style.alias=await loadLocal(style.id,style.postscript,style.style,style.weight,true);
      checks(Boolean(style.alias)===real,style.id+': exact PostScript availability');
    }
    const fullName=await loadLocal('full-name','Arial Narrow');
    checks(Boolean(fullName)===real,'full name Arial Narrow must not fall through to Arial');
    const missingFullName=await loadLocal('absent-condensed','Arial Condensed');
    checks(missingFullName===null,'src:local(Arial Condensed) must not strip the suffix');
    function measure(families,size,style,stretch,sample){
      const list=(Array.isArray(families)?families:[families]).map(n=>JSON.stringify(n)).join(',');
      g.font=`${style.style} ${style.weight} ${size}px ${list}`;g.fontStretch=stretch;
      const m=g.measureText(sample),metrics={};
      for(const key of ['width','actualBoundingBoxLeft','actualBoundingBoxRight','actualBoundingBoxAscent','actualBoundingBoxDescent','fontBoundingBoxAscent','fontBoundingBoxDescent'])metrics[key]=m[key];
      return {font:g.font,stretch:g.fontStretch,metrics};
    }
    const equal=(a,b)=>JSON.stringify(a.metrics)===JSON.stringify(b.metrics);
    for(const size of [12,24,40])for(const style of styles)for(const stretch of ['normal','condensed','expanded'])for(const sample of ['HxpgÅ','mmmmmmmmmmlli']){
      const requested=measure('Arial Narrow',size,style,stretch,sample);
      const arial=measure('Arial',size,style,stretch,sample);
      const local=style.alias?measure(style.alias,size,style,stretch,sample):null;
      const translated=measure('Arial Condensed',size,style,stretch,sample);
      const missingBase=measure(['SuffixControl Missing Condensed','Arial'],size,style,stretch,sample);
      const id=[size,style.id,stretch,sample].join('/');
      checks(requested.stretch===stretch,id+': native stretch state');
      if(real){
        checks(local!==null && equal(requested,local),id+': exact Narrow face must win');
        checks(requested.metrics.width<arial.metrics.width,id+': real Narrow must not become regular Arial');
      }else{
        checks(equal(requested,arial),id+': missing Narrow must select real Arial at matching weight/style');
      }
      checks(equal(translated,arial),id+': missing Arial Condensed uses Arial family in this set');
      checks(equal(missingBase,arial),id+': missing adjusted base preserves next CSS family');
      result.rows.push({size,style:style.id,weight:style.weight,stretch,sample,requested,arial,local,translated,missingBase});
    }
    result.passed=result.failures.length===0;
    for(const face of Array.from(document.fonts))if(face.family.startsWith('SuffixControl_'))document.fonts.delete(face);
  }catch(error){result.error=String(error.stack||error);result.passed=false;}
  document.querySelector('#out').textContent=JSON.stringify(result,null,2);
  if(query.get('report')==='1')await fetch('/result?'+auth,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});
})();
</script>
